<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句游英语 - 学习档案</title>

    <link rel="stylesheet" href="assets/common.css">
    <style>

        .search-box:focus-within {
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header .page-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .page-header .page-desc {
            font-size: 13px;
            color: var(--text-mute);
        }

        .page-actions {
            display: flex;
            gap: 10px;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(79, 110, 247, 0.1);
        }

        .stat-card .sc-label {
            font-size: 12px;
            color: var(--text-mute);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card .sc-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }

        .stat-card .sc-value .unit {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-mute);
            margin-left: 3px;
        }

        .stat-card .sc-trend {
            font-size: 12px;
            margin-top: 6px;
            color: var(--text-mute);
        }

        .stat-card .sc-trend.up { color: var(--success); }
        .stat-card .sc-trend.warn { color: var(--warn); }

        .main-tabs {
            display: flex;
            gap: 6px;
            background: #fff;
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 20px;
            width: fit-content;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            max-width: 100%;
            overflow-x: auto;
        }

        .main-tab {
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-tab:hover { background: #f4f6fc; }

        .main-tab.on {
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
        }

        .main-tab .tab-count {
            font-size: 12px;
            background: #eef2ff;
            color: var(--brand);
            border-radius: 20px;
            padding: 1px 8px;
            font-weight: 700;
        }

        .main-tab.on .tab-count {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        .fsrs-banner {
            background: linear-gradient(120deg, #eef2ff 0%, #e6ecff 100%);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .fsrs-banner .fsrs-icon { font-size: 24px; flex-shrink: 0; }

        .fsrs-banner .fsrs-text { flex: 1; min-width: 200px; }

        .fsrs-banner .fsrs-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .fsrs-banner .fsrs-desc {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .list-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .list-toolbar .tool-select {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-sub);
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        .list-toolbar .tool-select:focus { border-color: var(--brand); }

        .item-list { display: flex; flex-direction: column; }

        .item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .item:last-child { border-bottom: none; padding-bottom: 0; }

        .item:hover {
            background: #fafbff;
            margin: 0 -20px;
            padding-left: 20px;
            padding-right: 20px;
        }

        .item .item-index {
            width: 28px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mute);
            text-align: center;
            flex-shrink: 0;
        }

        .item .item-body { flex: 1; min-width: 0; }

        .item .item-en {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item .item-cn {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item .item-tags { display: flex; gap: 6px; flex-wrap: wrap; }

        .item-tag {
            font-size: 11px;
            color: var(--brand);
            background: #eef2ff;
            border-radius: 6px;
            padding: 3px 8px;
            white-space: nowrap;
        }

        .item-tag.due-now {
            color: #fff;
            background: linear-gradient(135deg, #ff9f43, #ff7b00);
            font-weight: 600;
        }

        .item-tag.word {
            color: #fff;
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
        }

        .item-tag.mastered {
            color: #fff;
            background: linear-gradient(135deg, #22a06b, #35b87d);
        }

        /* ★ 复习状态标签样式 */
        .item-tag.state-new {
            color: #666;
            background: #eef1f8;
        }
        .item-tag.state-learning {
            color: #fff;
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
        }
        .item-tag.state-review {
            color: #fff;
            background: linear-gradient(135deg, #22a06b, #35b87d);
        }
        .item-tag.state-relearning {
            color: #fff;
            background: linear-gradient(135deg, #ff5b5b, #ff7b7b);
        }

        .item .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .item-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .item-btn:hover {
            background: #f4f6fc;
            border-color: #c9d4f5;
            color: var(--brand);
        }

        .item-btn:active { transform: scale(0.94); }

        .item-btn.play:hover { background: #eef2ff; color: var(--brand); }
        .item-btn.danger:hover { background: #ffeaea; border-color: #ffc9c9; color: var(--danger); }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-mute);
        }

        .empty-state .es-icon {
            font-size: 52px;
            margin-bottom: 14px;
            opacity: 0.5;
        }

        .empty-state .es-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .empty-state .es-desc {
            font-size: 13px;
            color: var(--text-mute);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .empty-state .es-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.25);
        }

        @media (max-width: 768px) {
            .page-header .page-title { font-size: 20px; }
            .main-tabs { width: 100%; overflow-x: auto; }
            .item .item-actions { flex-wrap: wrap; }
        }
    </style>
        <!-- 云端同步模块 -->
    <script src="juyou-sync.js"></script>
    <script src="assets/common.js"></script>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="jy-sidebar"></aside>

    <div class="main-area">

        <header class="topbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" placeholder="搜索生词、句子...">
            </div>

            <div class="topbar-right">
                <div class="topbar-icon-btn" data-tip="通知中心（后续步骤实现）">
                    🔔
                    <span class="badge-dot"></span>
                </div>
                <div class="topbar-icon-btn" data-tip="帮助中心（后续步骤实现）">❓</div>
                <div class="user-avatar" data-href="profile.html">学</div>
            </div>
        </header>

        <div class="content-scroll">

            <div class="page-header">
                <div>
                    <div class="page-title">学习档案</div>
                    <div class="page-desc">智能复习调度 · 生词集中管理 · 掌握进度追踪</div>
                </div>

                    <div class="sc-label">📕 复习本</div>

                    <div class="sc-trend" id="statReviewTrend">暂无数据</div>

                <div class="stat-card">

            <div class="main-tabs" id="mainTabs">

            <!-- Tab 1：复习本 -->
            <div id="panel-review" class="tab-panel">

                    <div class="fsrs-text">
                        <div class="fsrs-title">FSRS 智能复习系统已开启</div>
                        <div class="fsrs-desc">答对 1 次延后 1 天，答对 2 次延后 3 天，连续答对 3 次自动进入掌握列表</div>
                    </div>
                    <button class="btn-primary" data-href="learn.html">开始复习</button>
                </div>

                <div class="card">
                    <div class="card-head">
                        <div class="card-title">今日待复习</div>
                        <div class="list-toolbar">
                            <select class="tool-select" data-tip="排序方式（后续步骤实现）">

                        <div class="list-toolbar">
                            <select class="tool-select" data-tip="排序方式（后续步骤实现）">
                                <option>按加入时间</option>
                                <option>按出现频率</option>
                                <option>按字母顺序</option>

                        <div class="card-title">已完全掌握的内容（不会再出现在练习中）</div>
                        <div class="list-toolbar">
                            <select class="tool-select" data-tip="排序方式（后续步骤实现）">
                                <option>按掌握时间</option>
                                <option>按学习次数</option>

</div>

<script>
/* ============================================================
   登录状态检查
   ============================================================ */
JUYOU.requireLogin();

/* ============================================================
   ★★★ 网络时间同步 JYTime（双源：Cloudflare + 苏宁，已去掉 GitHub） ★★★
   ============================================================ */

/* ============================================================
   本地学习数据访问 JYStore（只读）
   ============================================================ */
window.JYStore = (function() {
    var KEY = 'juyou_study';

    function getDefault() {
        return {
            records: [], reviewBook: [], wordBook: [], mastered: [], starred: [],
            stats: {
                totalDays: 0, totalTime: 0, totalSentences: 0,
                streak: 0, lastStudyDate: null,
                todayCount: 0, todayDate: null
            }
        };
    }

    function load() {
        try {
            var raw = localStorage.getItem(KEY);
            if (!raw) return getDefault();
            var data = JSON.parse(raw);
            var def = getDefault();
            return {
                records: data.records || def.records,
                reviewBook: data.reviewBook || def.reviewBook,
                wordBook: data.wordBook || def.wordBook,
                mastered: data.mastered || def.mastered,
                starred: data.starred || def.starred,
                stats: Object.assign({}, def.stats, data.stats || {})
            };
        } catch (e) {
            return getDefault();
        }
    }

    function save(data) {
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    }

    function removeFromReviewBook(en) {
        var data = load();
        data.reviewBook = data.reviewBook.filter(function(item) {
            return item.en !== en;
        });
        save(data);
    }

    function removeFromMastered(en) {
        var data = load();
        data.mastered = data.mastered.filter(function(item) {
            return item.en !== en;
        });
        save(data);
    }

    function removeFromWordBook(word) {
        var data = load();
        data.wordBook = data.wordBook.filter(function(item) {
            return item.word !== word;
        });
        save(data);
    }

    return {
        load: load,
        save: save,
        removeFromReviewBook: removeFromReviewBook,
        removeFromMastered: removeFromMastered,
        removeFromWordBook: removeFromWordBook
    };
})();

/* ============================================================
   工具函数
   ============================================================ */

function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date(JYTime.now());
    var diff = now - d;
    var minutes = Math.floor(diff / 60000);
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return minutes + ' 分钟前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小时前';
    var days = Math.floor(hours / 24);
    if (days < 30) return days + ' 天前';
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

function speak(text) {
    if (!('speechSynthesis' in window)) {
        alert('当前浏览器不支持语音朗读');
        return;
    }
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

/* ============================================================
   渲染统计卡片 + Tab 数字
   ============================================================ */
function renderStats() {
    var data = JYStore.load();
    var now = JYTime.now();

    var reviewCount = data.reviewBook.length;
    var wordCount = data.wordBook.length;
    var masteredCount = data.mastered.length;
    var dueCount = data.reviewBook.filter(function(r) {
        return r.nextReview && r.nextReview <= now;
    }).length;

    document.getElementById('statReview').textContent = reviewCount;
    document.getElementById('statWords').textContent = wordCount;
    document.getElementById('statMastered').textContent = masteredCount;
    document.getElementById('statDue').textContent = dueCount;

    document.getElementById('tabCountReview').textContent = reviewCount;
    document.getElementById('tabCountWords').textContent = wordCount;
    document.getElementById('tabCountMastered').textContent = masteredCount;

    var trendReview = document.getElementById('statReviewTrend');
    if (reviewCount === 0) {
        trendReview.textContent = '暂无数据';
        trendReview.className = 'sc-trend';
    } else if (dueCount > 0) {
        trendReview.textContent = '⚠ ' + dueCount + ' 句待复习';
        trendReview.className = 'sc-trend warn';
    } else {
        trendReview.textContent = '✓ 暂无到期';
        trendReview.className = 'sc-trend up';
    }

    var trendWords = document.getElementById('statWordsTrend');
    if (wordCount === 0) {
        trendWords.textContent = '还没有生词';
        trendWords.className = 'sc-trend';
    } else {
        trendWords.textContent = '共 ' + wordCount + ' 个';
        trendWords.className = 'sc-trend up';
    }

    var trendMastered = document.getElementById('statMasteredTrend');
    if (masteredCount === 0) {
        trendMastered.textContent = '继续加油';
        trendMastered.className = 'sc-trend';
    } else {
        trendMastered.textContent = '✓ 已掌握 ' + masteredCount + ' 句';
        trendMastered.className = 'sc-trend up';
    }

    var trendDue = document.getElementById('statDueTrend');
    if (dueCount === 0) {
        trendDue.textContent = '今日无待复习';
        trendDue.className = 'sc-trend';
    } else {
        trendDue.textContent = '预计耗时 ' + Math.max(1, Math.round(dueCount * 0.5)) + ' 分钟';
        trendDue.className = 'sc-trend warn';
    }
}

/* ============================================================
   渲染复习本列表（★ 显示 FSRS 状态）
   ============================================================ */
function renderReviewList() {
    var data = JYStore.load();
    var listEl = document.getElementById('reviewList');
    var now = JYTime.now();

    if (data.reviewBook.length === 0) {
        listEl.innerHTML =
            '<div class="empty-state">' +
                '<div class="es-icon">📕</div>' +
                '<div class="es-title">复习本还是空的</div>' +
                '<div class="es-desc">练习中答错的句子会自动出现在这里<br>方便你针对性复习</div>' +
                '<a class="es-btn" href="learn.html">去练习</a>' +
            '</div>';
        return;
    }

    var html = '';
    data.reviewBook.forEach(function(item, i) {
        var due = item.nextReview && item.nextReview <= now;
        var hoursLeft = item.nextReview
            ? Math.max(0, Math.round((item.nextReview - now) / 3600000))
            : 0;

        var dueTag = due
            ? '<span class="item-tag due-now">🔔 已到期</span>'
            : '<span class="item-tag">⏰ ' + (hoursLeft < 1 ? '即将到期' : hoursLeft + ' 小时后到期') + '</span>';

        // ★ 显示 FSRS 状态
        var stateText = '新内容';
        var stateCls = 'state-new';
        if (item.state === 'learning') { stateText = '📘 学习中'; stateCls = 'state-learning'; }
        else if (item.state === 'review') { stateText = '🔁 复习中'; stateCls = 'state-review'; }
        else if (item.state === 'relearning') { stateText = '⚠️ 重新学习'; stateCls = 'state-relearning'; }

        html +=
            '<div class="item">' +
                '<div class="item-index">' + (i + 1) + '</div>' +
                '<div class="item-body">' +
                    '<div class="item-en">' + escapeHtml(item.en) + '</div>' +
                    '<div class="item-cn">' + escapeHtml(item.cn) + '</div>' +
                    '<div class="item-tags">' +
                        '<span class="item-tag ' + stateCls + '">' + stateText + '</span>' +
                        dueTag +
                        '<span class="item-tag">' + escapeHtml(formatTime(item.addTime)) + ' 加入</span>' +
                    '</div>' +
                '</div>' +
                '<div class="item-actions">' +
                    '<button class="item-btn play" data-action="speak" data-en="' + escapeHtml(item.en) + '" title="听发音">🔊</button>' +
                    '<button class="item-btn" data-action="practice" title="立即复习">▶</button>' +
                    '<button class="item-btn danger" data-action="remove-review" data-en="' + escapeHtml(item.en) + '" title="移出复习本">✕</button>' +
                '</div>' +
            '</div>';
    });

    listEl.innerHTML = html;
}

/* ============================================================
   渲染生词本列表
   ============================================================ */
function renderWordList() {
    var data = JYStore.load();
    var listEl = document.getElementById('wordList');

    if (data.wordBook.length === 0) {
        listEl.innerHTML =
            '<div class="empty-state">' +
                '<div class="es-icon">📒</div>' +
                '<div class="es-title">生词本还是空的</div>' +
                '<div class="es-desc">在阅读模式中点击不认识的单词<br>即可加入生词本（功能开发中）</div>' +
            '</div>';
        return;
    }

    var html = '';
    data.wordBook.forEach(function(item, i) {
        html +=
            '<div class="item">' +
                '<div class="item-index">' + (i + 1) + '</div>' +
                '<div class="item-body">' +
                    '<div class="item-en">' + escapeHtml(item.word) + '</div>' +
                    '<div class="item-cn">' + escapeHtml(item.cn || '') + '</div>' +
                    '<div class="item-tags">' +
                        '<span class="item-tag word">生词</span>' +
                        '<span class="item-tag">出现 ' + (item.count || 1) + ' 次</span>' +
                    '</div>' +
                '</div>' +
                '<div class="item-actions">' +
                    '<button class="item-btn play" data-action="speak" data-en="' + escapeHtml(item.word) + '" title="听发音">🔊</button>' +
                    '<button class="item-btn danger" data-action="remove-word" data-word="' + escapeHtml(item.word) + '" title="移出生词本">✕</button>' +
                '</div>' +
            '</div>';
    });

    listEl.innerHTML = html;
}

/* ============================================================
   渲染掌握列表
   ============================================================ */
function renderMasteredList() {
    var data = JYStore.load();
    var listEl = document.getElementById('masteredList');

    if (data.mastered.length === 0) {
        listEl.innerHTML =
            '<div class="empty-state">' +
                '<div class="es-icon">✅</div>' +
                '<div class="es-title">还没有已掌握的句子</div>' +
                '<div class="es-desc">答错进入复习本后，连续答对 3 次<br>会自动进入掌握列表</div>' +
                '<a class="es-btn" href="learn.html">去练习</a>' +
            '</div>';
        return;
    }

    var html = '';
    data.mastered.forEach(function(item, i) {
        html +=
            '<div class="item">' +
                '<div class="item-index">' + (i + 1) + '</div>' +
                '<div class="item-body">' +
                    '<div class="item-en">' + escapeHtml(item.en) + '</div>' +
                    '<div class="item-cn">' + escapeHtml(item.cn) + '</div>' +
                    '<div class="item-tags">' +
                        '<span class="item-tag mastered">✅ 已掌握</span>' +
                        '<span class="item-tag">正确率 ' + (item.accuracy || 100) + '%</span>' +
                        '<span class="item-tag">' + escapeHtml(formatTime(item.masteredTime)) + ' 掌握</span>' +
                    '</div>' +
                '</div>' +
                '<div class="item-actions">' +
                    '<button class="item-btn play" data-action="speak" data-en="' + escapeHtml(item.en) + '" title="听发音">🔊</button>' +
                    '<button class="item-btn danger" data-action="remove-mastered" data-en="' + escapeHtml(item.en) + '" title="移出掌握列表">↩</button>' +
                '</div>' +
            '</div>';
    });

    listEl.innerHTML = html;
}

function renderAll() {
    renderStats();
    renderReviewList();
    renderWordList();
    renderMasteredList();
}

/* ============================================================
   列表按钮事件
   ============================================================ */
document.addEventListener('click', function(e) {
    var target = e.target.closest('[data-action]');
    if (!target) return;
    e.stopPropagation();

    var action = target.getAttribute('data-action');

    if (action === 'speak') {
        var en = target.getAttribute('data-en');
        if (en) speak(en);
    } else if (action === 'practice') {
        window.location.href = 'learn.html';
    } else if (action === 'remove-review') {
        var enR = target.getAttribute('data-en');
        if (!confirm('确定要移出复习本吗？')) return;
        JYStore.removeFromReviewBook(enR);
        renderAll();
    } else if (action === 'remove-mastered') {
        var enM = target.getAttribute('data-en');
        if (!confirm('确定要移出掌握列表吗？')) return;
        JYStore.removeFromMastered(enM);
        renderAll();
    } else if (action === 'remove-word') {
        var word = target.getAttribute('data-word');
        if (!confirm('确定要移出生词本吗？')) return;
        JYStore.removeFromWordBook(word);
        renderAll();
    }
});

/* ============================================================
   页面跳转
   ============================================================ */

/* ============================================================
   Tab 切换
   ============================================================ */
(function() {
    var tabs = document.querySelectorAll('.main-tab');
    var panels = {
        review: document.getElementById('panel-review'),
        words: document.getElementById('panel-words'),
        mastered: document.getElementById('panel-mastered')
    };

    tabs.forEach(function(tab) {
        tab.addEventListener('click', function(e) {
            e.stopPropagation();
            tabs.forEach(function(t) { t.classList.remove('on'); });
            this.classList.add('on');

            var name = this.getAttribute('data-tab');
            Object.keys(panels).forEach(function(key) {
                if (panels[key]) {
                    panels[key].style.display = (key === name) ? 'block' : 'none';
                }
            });
        });
    });
})();

/* ============================================================
   初始化：先立即渲染一次（用本地缓存），再异步拉云端 + 同步网络时间，完成后重渲染
   ============================================================ */
renderAll();

(async function() {
    try {
        await Promise.all([
            JYTime.sync(),
            window.JYSync ? JYSync.pull().catch(function() { return null; }) : Promise.resolve(null)
        ]);
        renderAll();
    } catch (e) {
        console.warn('[Archive] 云端拉取失败，使用本地数据：', e);
    }
})();
</script>
