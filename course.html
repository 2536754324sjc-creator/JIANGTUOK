<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情 - 句游英语</title>
    <script src="juyou-sync.js"></script>
    <script src="data/juyou-courses-registry.js"></script>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        
        .back-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-sub); cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: background 0.2s; flex-shrink: 0; }
        .back-btn:hover { background: #f4f6fc; color: var(--brand); }
        .topbar-title { font-size: 15px; font-weight: 700; color: var(--text-main); }

        .content-scroll { padding: 24px 28px 110px; }
        .content-wrap { max-width: 1100px; margin: 0 auto; }

        .hero-block { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04); margin-bottom: 20px; display: flex; flex-wrap: wrap; }
        .hero-cover { width: 320px; min-height: 220px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .hero-cover .cover-bg { position: absolute; inset: 0; }
        .grad-1 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .grad-2 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .grad-3 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .grad-4 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .grad-5 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .grad-6 { background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%); }
        .grad-7 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .grad-8 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .hero-emoji { position: relative; z-index: 1; font-size: 100px; line-height: 1; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15)); }
        .hero-info { flex: 1; min-width: 260px; padding: 26px 28px; display: flex; flex-direction: column; }
        .hero-title { font-size: 26px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; line-height: 1.3; }
        .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .hero-tag { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 8px; background: #eef2ff; color: var(--brand); }
        .hero-tag.green { background: #ecfdf5; color: #16a34a; }
        .hero-tag.mid { background: #fef3c7; color: #d97706; }
        .hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin-top: auto; }
        .hs-item { background: #f8faff; border-radius: 12px; padding: 12px 16px; }
        .hs-value { font-size: 22px; font-weight: 800; color: var(--text-main); line-height: 1.1; }
        .hs-value .unit { font-size: 12px; font-weight: 600; color: var(--text-mute); margin-left: 2px; }
        .hs-label { font-size: 12px; color: var(--text-mute); margin-top: 4px; }

        .desc-card { background: #fff; border-radius: 16px; padding: 22px 26px; box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04); margin-bottom: 16px; font-size: 14px; color: #4a4a5e; line-height: 1.85; letter-spacing: 0.2px; }
        .member-hint { background: #fff8ec; border: 1px solid #ffe3c2; border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; }
        .member-hint .crown { font-size: 20px; line-height: 1.4; flex-shrink: 0; }
        .member-hint .hint-text { flex: 1; font-size: 13px; color: #d97706; line-height: 1.7; font-weight: 500; }

        .progress-card { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04); margin-bottom: 16px; }
        .progress-card .pc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .progress-card .pc-label { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .progress-card .pc-percent { font-size: 16px; font-weight: 800; color: var(--brand); }
        .progress-card .pc-track { height: 8px; background: #eef1f8; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
        .progress-card .pc-fill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #4f6ef7, #7b8fff); transition: width 0.8s ease; }
        .progress-card .pc-hint { font-size: 12px; color: var(--text-mute); text-align: right; }

        .stats-section { background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04); margin-bottom: 16px; }
        .stats-section .ss-title { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .stat-cell { background: #f8faff; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
        .stat-cell .cell-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0; }
        .stat-cell .cell-icon.blue { background: linear-gradient(135deg, #4f6ef7, #7b8fff); }
        .stat-cell .cell-icon.green { background: linear-gradient(135deg, #22a06b, #35b87d); }
        .stat-cell .cell-icon.red { background: linear-gradient(135deg, #ff5b5b, #ff7b7b); }
        .stat-cell .cell-icon.orange { background: linear-gradient(135deg, #ff9f43, #ffb86b); }
        .stat-cell .cell-value { font-size: 22px; font-weight: 800; color: var(--text-main); line-height: 1.1; }
        .stat-cell .cell-label { font-size: 12px; color: var(--text-mute); margin-top: 4px; }

        .catalog-section { background: #fff; border-radius: 16px; padding: 22px 24px 20px; box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04); }
        .catalog-head { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }
        .catalog-head .head-left { display: flex; align-items: center; gap: 8px; }
        .catalog-head .head-right { font-size: 12px; color: var(--text-mute); font-weight: 500; }

        .unit-card { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; background: #fff; }
        .unit-card:hover { border-color: #c9d4f5; }
        .unit-card.expanded { border-color: #c9d4f5; box-shadow: 0 4px 16px rgba(79, 110, 247, 0.08); }
        .unit-head { display: flex; align-items: center; gap: 16px; padding: 18px 20px; cursor: pointer; user-select: none; }
        .unit-no { font-size: 24px; font-weight: 800; color: #c9d0e0; font-style: italic; min-width: 40px; text-align: center; flex-shrink: 0; letter-spacing: -1px; line-height: 1; transition: color 0.2s; }
        .unit-card.expanded .unit-no { color: var(--brand); }
        .unit-info { flex: 1; min-width: 0; }
        .unit-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; line-height: 1.4; }
        .unit-desc { font-size: 12.5px; color: var(--text-mute); line-height: 1.55; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
        .unit-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .unit-count { font-size: 13px; color: var(--text-mute); white-space: nowrap; }
        .unit-arrow { width: 30px; height: 30px; border-radius: 50%; background: #f4f6fc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-sub); transition: transform 0.3s, background 0.2s, color 0.2s; flex-shrink: 0; }
        .unit-card.expanded .unit-arrow { transform: rotate(180deg); background: #eef2ff; color: var(--brand); }
        .unit-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .unit-card.expanded .unit-body { max-height: 1400px; }
        .unit-body-inner { padding: 4px 20px 22px; border-top: 1px solid var(--border); }

        .section-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-main); margin: 18px 0 10px; }
        .section-label:first-child { margin-top: 16px; }
        .tag-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-purple { font-size: 13px; padding: 6px 14px; border-radius: 8px; background: #eef2ff; color: var(--brand); font-weight: 500; line-height: 1.4; }
        .tag-green { font-size: 13px; padding: 8px 14px; border-radius: 8px; background: #ecfdf5; color: #16a34a; font-weight: 500; line-height: 1.6; display: block; width: 100%; margin-bottom: 6px; }

        .unit-action-row { display: flex; gap: 10px; align-items: center; }
        .unit-continue-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 16px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
        .unit-continue-btn.primary { background: #eef2ff; color: var(--brand); }
        .unit-continue-btn.primary:hover { background: #dfe7ff; }
        .unit-continue-btn.secondary { background: #f4f6fc; color: var(--text-sub); }
        .unit-continue-btn.secondary:hover { background: #e9edfa; color: var(--brand); }

        .bottom-bar { position: fixed; left: 220px; right: 0; bottom: 0; background: #fff; padding: 14px 28px; box-shadow: 0 -4px 20px rgba(20, 40, 90, 0.06); z-index: 100; display: flex; justify-content: center; gap: 12px; }
        .join-btn { width: 100%; max-width: 1044px; height: 50px; border-radius: 14px; border: none; background: linear-gradient(135deg, #4f6ef7, #6b8aff); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 6px 18px rgba(79, 110, 247, 0.35); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .join-btn:hover { opacity: 0.92; }
        .delete-btn { width: 50px; height: 50px; flex-shrink: 0; border-radius: 14px; border: 1.5px solid #eef1f8; background: #fff; color: var(--text-sub); font-size: 18px; cursor: pointer; }
        .delete-btn:hover { background: #ffeaea; color: #ff5b5b; border-color: #ffc9c9; }

        .empty-state { text-align: center; padding: 80px 20px; color: #999; font-size: 14px; }
        /* ★ 删除确认对话框 */
        .confirm-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 30, 60, 0.45);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .confirm-mask.on { display: flex; }

        .confirm-box {
            background: #fff;
            border-radius: 18px;
            padding: 32px 28px 22px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(20, 40, 90, 0.24);
            animation: confirmIn 0.22s ease-out;
        }

        @keyframes confirmIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .confirm-icon { font-size: 46px; margin-bottom: 14px; line-height: 1; }

        .confirm-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .confirm-desc {
            font-size: 13px;
            color: var(--text-mute);
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .confirm-actions { display: flex; gap: 12px; }

        .confirm-btn {
            flex: 1;
            height: 44px;
            border-radius: 11px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.1s, background 0.2s;
        }
        .confirm-btn:active { transform: scale(0.98); }

        .confirm-btn.cancel {
            background: #f4f6fc;
            color: var(--text-sub);
        }
        .confirm-btn.cancel:hover { background: #e9edfa; color: var(--brand); }

        .confirm-btn.delete {
            background: linear-gradient(135deg, #ff5b5b, #ff7b7b);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 91, 91, 0.3);
        }
        .confirm-btn.delete:hover { opacity: 0.9; }

        @media (max-width: 900px) {
            .sidebar { width: 64px; padding: 16px 8px; }
            .sidebar .logo { font-size: 0; justify-content: center; padding: 0; }
            .sidebar .logo .logo-icon { font-size: 22px; }
            .nav-item { justify-content: center; padding: 12px 0; }
            .nav-item .nav-text { display: none; }
            .nav-group-title { display: none; }
            .vip-card { display: none; }
            .content-scroll { padding: 16px 14px 110px; }
            .topbar { padding: 12px 14px; }
            .hero-cover { width: 100%; min-height: 180px; }
            .hero-emoji { font-size: 80px; }
            .hero-info { padding: 20px; }
            .hero-title { font-size: 20px; }
            .bottom-bar { left: 64px; padding: 12px 14px; }
        }
    </style>
    <script src="assets/common.js"></script>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="jy-sidebar"></aside>

    <div class="main-area">
        <header class="topbar">
            <div class="back-btn" id="backBtn"><span>‹</span><span id="backText">返回</span></div>
            <div class="topbar-title" id="topbarTitle">课程详情</div>
            <div class="topbar-right">
                <div class="user-avatar" id="userAvatar" data-href="profile.html">学</div>
            </div>
        </header>

        <div class="content-scroll">
            <div class="content-wrap" id="detailContent"></div>
        </div>

        <div class="bottom-bar" id="bottomBar"></div>
        <!-- ★ 删除确认对话框 -->
        <div class="confirm-mask" id="deleteConfirmMask">
            <div class="confirm-box">
                <div class="confirm-icon">🗑️</div>
                <div class="confirm-title">移出我的课程？</div>
                <div class="confirm-desc" id="deleteConfirmDesc">移出后，本门课程的进度数据将被清除，无法恢复。</div>
                <div class="confirm-actions">
                    <button class="confirm-btn cancel" id="deleteConfirmCancel">取消</button>
                    <button class="confirm-btn delete" id="deleteConfirmOk">确定删除</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
/* 登录检查 */
JUYOU.requireLogin();
var avatarEl = document.getElementById('userAvatar');
if (avatarEl && window.currentUser) avatarEl.textContent = (window.currentUser.nickname || '学习者').slice(-1);

function getUrlParam(name) {
    var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
}

var COURSE_ID = getUrlParam('course');

/* 我的课程读写 */
function getMyCourses() {
    try {
        var raw = localStorage.getItem('juyou_my_courses');
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}
function saveMyCourses(list) { try { localStorage.setItem('juyou_my_courses', JSON.stringify(list)); } catch (e) {} }
function getMyCourse(id) {
    var list = getMyCourses();
    for (var i = 0; i < list.length; i++) if (list[i].courseId === id) return list[i];
    return null;
}
function joinCourse(id) {
    var list = getMyCourses();
    if (list.some(function(c) { return c.courseId === id; })) return false;
    list.push({ courseId: id, addTime: Date.now(), lastPracticeTime: null, progress: 0, currentLesson: 1, completedLessons: [], practiceCount: 0, completedSentences: 0, masteredErrors: 0, totalSeconds: 0 });
    saveMyCourses(list);
    return true;
}
function removeCourse(id) {
    saveMyCourses(getMyCourses().filter(function(c) { return c.courseId !== id; }));
}

/* 渲染 */
function renderDetail() {
    var container = document.getElementById('detailContent');
    var bottomBar = document.getElementById('bottomBar');
    var topbarTitle = document.getElementById('topbarTitle');
    var backText = document.getElementById('backText');

    /* ★ 从课程库读取 */
    var course = window.JY_COURSES ? window.JY_COURSES.get(COURSE_ID) : null;

    if (!course) {
        container.innerHTML = '<div class="empty-state">📭 没有找到该课程</div>';
        bottomBar.innerHTML = '';
        return;
    }

    var totalLessons = course.units ? course.units.length : 0;
    var totalSentences = window.JY_COURSES.totalSentences(COURSE_ID);

    var myCourse = getMyCourse(COURSE_ID);
    var isJoined = !!myCourse;

    topbarTitle.textContent = isJoined ? '课程详情' : '课程市场详情';
    backText.textContent = isJoined ? '返回我的课程' : '返回商城';

    var levelCls = 'hero-tag green';
    if (course.level === '中级') levelCls = 'hero-tag mid';
    if (course.level === '高级') levelCls = 'hero-tag mid';

    var html =
        '<div class="hero-block">' +
            '<div class="hero-cover"><div class="cover-bg grad-' + (course.grad || 1) + '"></div>' +
                '<div class="hero-emoji">' + (course.emoji || '📘') + '</div></div>' +
            '<div class="hero-info">' +
                '<div class="hero-title">' + course.title + '</div>' +
                '<div class="hero-tags">' +
                    '<span class="' + levelCls + '">' + (course.level || '初级') + '</span>' +
                    '<span class="hero-tag">👤 ' + (course.learners || 0) + ' 人在学</span>' +
                '</div>' +
                '<div class="hero-stats">' +
                    '<div class="hs-item"><div class="hs-value">' + totalLessons + '<span class="unit">节</span></div><div class="hs-label">包含课节</div></div>' +
                    '<div class="hs-item"><div class="hs-value">' + totalSentences + '<span class="unit">句</span></div><div class="hs-label">精选句子</div></div>' +
                '</div>' +
            '</div>' +
        '</div>';

    if (!isJoined) {
        html += '<div class="desc-card">' + (course.description || '') + '</div>';
        if (course.isMemberOnly) {
            html += '<div class="member-hint"><span class="crown">👑</span><div class="hint-text">该课程面向正式付费会员，您可以添加并试学第一节课</div></div>';
        }
    } else {
        var progress = myCourse.progress || 0;
        var completedCount = (myCourse.completedLessons || []).length;
        html +=
            '<div class="progress-card">' +
                '<div class="pc-head"><span class="pc-label">学习进度</span><span class="pc-percent">' + progress + '%</span></div>' +
                '<div class="pc-track"><div class="pc-fill" style="width:' + progress + '%"></div></div>' +
                '<div class="pc-hint">已完成 ' + completedCount + ' / ' + totalLessons + ' 节</div>' +
            '</div>';

        var pc = myCourse.practiceCount || 0;
        var cs = myCourse.completedSentences || 0;
        var me = myCourse.masteredErrors || 0;
        var ts = myCourse.totalSeconds || 0;
        var durText = ts < 60 ? (ts + '秒') : (Math.round(ts / 60) + '分钟');

        html +=
            '<div class="stats-section">' +
                '<div class="ss-title">📊 学习统计</div>' +
                '<div class="stats-grid">' +
                    '<div class="stat-cell"><div class="cell-icon blue">▶</div><div><div class="cell-value">' + pc + '</div><div class="cell-label">练习次数</div></div></div>' +
                    '<div class="stat-cell"><div class="cell-icon green">📖</div><div><div class="cell-value">' + cs + '</div><div class="cell-label">完成句子</div></div></div>' +
                    '<div class="stat-cell"><div class="cell-icon red">✕</div><div><div class="cell-value">' + me + '</div><div class="cell-label">攻克错题</div></div></div>' +
                    '<div class="stat-cell"><div class="cell-icon orange">⏱</div><div><div class="cell-value">' + durText + '</div><div class="cell-label">学习时长</div></div></div>' +
                '</div>' +
            '</div>';
    }

    /* 目录 */
    var completedLessons = isJoined ? (myCourse.completedLessons || []) : [];
    var currentLesson = isJoined ? (myCourse.currentLesson || 1) : 1;

    html += '<div class="catalog-section"><div class="catalog-head"><div class="head-left"><span>📋</span><span>课程目录</span></div><div class="head-right">共 ' + totalLessons + ' 节</div></div>';

    (course.units || []).forEach(function(unit, idx) {
        var noStr = (idx + 1 < 10 ? '0' : '') + (idx + 1);
        var isCompleted = completedLessons.indexOf(idx + 1) >= 0;
        var isCurrent = (idx + 1) === currentLesson;

        var vocabTags = (unit.vocabulary || []).map(function(w) { return '<span class="tag-purple">' + w + '</span>'; }).join('');
        var phraseTags = (unit.phrases || []).map(function(p) { return '<span class="tag-purple">' + p + '</span>'; }).join('');
        var grammarTags = (unit.grammar || []).map(function(g) { return '<span class="tag-green">' + g + '</span>'; }).join('');

        var actionRow = '';
        if (isJoined) {
            if (isCompleted) actionRow = '<button class="unit-continue-btn secondary" data-unit="' + (idx + 1) + '">🔁 复习</button>';
            else if (isCurrent) actionRow = '<button class="unit-continue-btn primary" data-unit="' + (idx + 1) + '">▶ 继续</button>';
            else actionRow = '<button class="unit-continue-btn secondary" data-unit="' + (idx + 1) + '">▶ 开始</button>';
        }

        html +=
            '<div class="unit-card" data-unit-idx="' + (idx + 1) + '">' +
                '<div class="unit-head">' +
                    '<div class="unit-no">' + noStr + '</div>' +
                    '<div class="unit-info"><div class="unit-title">' + unit.title + '</div><div class="unit-desc">' + (unit.desc || '') + '</div></div>' +
                    '<div class="unit-right">' +
                        '<span class="unit-count">' + (unit.sentenceCount || 0) + ' 句</span>' +
                        actionRow +
                        '<span class="unit-arrow">▾</span>' +
                    '</div>' +
                '</div>' +
                '<div class="unit-body"><div class="unit-body-inner">' +
                    '<div class="section-label"><span>📕</span><span>核心词汇</span></div><div class="tag-wrap">' + vocabTags + '</div>' +
                    '<div class="section-label"><span>📗</span><span>核心短语</span></div><div class="tag-wrap">' + phraseTags + '</div>' +
                    '<div class="section-label"><span>📘</span><span>语法结构</span></div><div class="tag-wrap">' + grammarTags + '</div>' +
                '</div></div>' +
            '</div>';
    });

    html += '</div>';
    container.innerHTML = html;

    /* 底部按钮 */
    if (!isJoined) {
        bottomBar.innerHTML = '<button class="join-btn" id="joinBtn">+ 加入我的课程库</button>';
        document.getElementById('joinBtn').addEventListener('click', function() {
            joinCourse(COURSE_ID);
            renderDetail();
        });
    } else {
        var firstIncomplete = 1;
        for (var i = 1; i <= totalLessons; i++) {
            if (completedLessons.indexOf(i) < 0) { firstIncomplete = i; break; }
        }
        bottomBar.innerHTML =
            '<button class="delete-btn" id="deleteBtn" title="移出我的课程库">🗑</button>' +
            '<button class="join-btn" id="startBtn">▶ 开始学习 · L' + firstIncomplete + '</button>';

               document.getElementById('deleteBtn').addEventListener('click', function() {
            var mask = document.getElementById('deleteConfirmMask');
            if (mask) mask.classList.add('on');
        });

        document.getElementById('startBtn').addEventListener('click', function() {
           window.location.href = 'loading.html?course=' + encodeURIComponent(COURSE_ID) + '&lesson=' + firstIncomplete;
        });
    }

    /* 单元展开 */
    container.querySelectorAll('.unit-card').forEach(function(card) {
        var head = card.querySelector('.unit-head');
        if (!head) return;
        head.addEventListener('click', function(e) {
            if (e.target.closest('.unit-continue-btn')) return;
            var wasOpen = card.classList.contains('expanded');
            container.querySelectorAll('.unit-card').forEach(function(c) { c.classList.remove('expanded'); });
            if (!wasOpen) card.classList.add('expanded');
        });
    });

    container.querySelectorAll('.unit-continue-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var unitNo = parseInt(this.getAttribute('data-unit'), 10) || 1;
            window.location.href = 'loading.html?course=' + encodeURIComponent(COURSE_ID) + '&lesson=' + unitNo;
        });
    });
}

document.getElementById('backBtn').addEventListener('click', function() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = 'mall.html';
});

/* 删除确认弹窗的事件绑定（只绑定一次） */
(function initDeleteConfirm() {
    var mask = document.getElementById('deleteConfirmMask');
    var btnCancel = document.getElementById('deleteConfirmCancel');
    var btnOk = document.getElementById('deleteConfirmOk');
    if (!mask || !btnCancel || !btnOk) return;

    function hide() { mask.classList.remove('on'); }

    btnCancel.addEventListener('click', hide);

    btnOk.addEventListener('click', function() {
        hide();
        removeCourse(COURSE_ID);
        renderDetail();
    });

    mask.addEventListener('click', function(e) {
        if (e.target === mask) hide();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mask.classList.contains('on')) hide();
    });
})();

renderDetail();</script>

</body>
