<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句游英语 - 课程包商城</title>
    <script src="juyou-sync.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #333;
            min-height: 100vh;
        }

        :root {
            --brand: #4f6ef7;
            --brand-light: #7b8fff;
            --text-main: #1a1a2e;
            --text-sub: #666;
            --text-mute: #999;
            --border: #eef1f8;
            --card-bg: #ffffff;
        }

        a { text-decoration: none; color: inherit; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d8dfee; border-radius: 99px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .app-layout { display: flex; min-height: 100vh; }

        /* ============================================================
           左侧导航栏
           ============================================================ */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--brand);
            padding: 0 12px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-group { margin-bottom: 8px; }

        .nav-group-title {
            font-size: 11px;
            color: #bbb;
            padding: 8px 12px;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 2px;
        }

        .nav-item:hover { background: #f4f6fc; color: var(--brand); }
        .nav-item.on { background: #eef2ff; color: var(--brand); font-weight: 600; }

        .nav-item .nav-icon {
            font-size: 17px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-bottom { margin-top: auto; padding-top: 16px; }

        .vip-card {
            background: linear-gradient(135deg, #4f6ef7, #7b8fff);
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .vip-card .vip-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .vip-card .vip-desc { font-size: 11px; opacity: 0.85; line-height: 1.5; }

        /* ============================================================
           右侧主区域
           ============================================================ */
        .main-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .search-box {
            flex: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f6fc;
            border-radius: 10px;
            padding: 0 14px;
            height: 40px;
            transition: box-shadow 0.2s;
        }

        .search-box:focus-within {
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-main);
        }

        .search-box input::placeholder { color: #b3bdd1; }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .streak-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff5f0;
            border: 1px solid #ffe3d3;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            color: #ff6b35;
        }

        .topbar-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            color: var(--text-sub);
            transition: background 0.2s;
            position: relative;
        }

        .topbar-icon-btn:hover { background: #f4f6fc; }

        .badge-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            background: #ff5b5b;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f6ef7, #7b8fff);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ============================================================
           内容区
           ============================================================ */
        .content-scroll { padding: 24px 28px 40px; }

        .page-header {
            margin-bottom: 20px;
        }

        .page-header .page-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .page-header .page-desc {
            font-size: 13px;
            color: var(--text-mute);
        }

        /* 分类 chips */
        .categories {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .cat-chip {
            padding: 9px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            background: #ffffff;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
        }

        .cat-chip:hover {
            border-color: #c9d4f5;
            color: var(--brand);
        }

        .cat-chip.on {
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.3);
        }

        /* 课程网格 */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(79, 110, 247, 0.15);
        }

        .course-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            position: relative;
            overflow: hidden;
        }

        .cover-grad-1 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .cover-grad-2 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .cover-grad-3 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .cover-grad-4 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .cover-grad-5 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .cover-grad-6 { background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%); }
        .cover-grad-7 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .cover-grad-8 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }

        .course-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .course-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .course-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            gap: 8px;
            margin-top: auto;
        }

        .course-level {
            color: #16a34a;
            font-weight: 600;
            padding: 3px 10px;
            background: #ecfdf5;
            border-radius: 6px;
            white-space: nowrap;
        }

        .course-learners {
            color: var(--text-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1100px) {
            .course-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        @media (max-width: 768px) {
            .sidebar { width: 64px; padding: 16px 8px; }
            .sidebar .logo { font-size: 0; justify-content: center; padding: 0; }
            .sidebar .logo .logo-icon { font-size: 22px; }
            .nav-item { justify-content: center; padding: 12px 0; }
            .nav-item .nav-text { display: none; }
            .nav-group-title { display: none; }
            .vip-card { display: none; }
            .content-scroll { padding: 16px 14px 32px; }
            .topbar { padding: 12px 14px; }
            .page-header .page-title { font-size: 20px; }
            .course-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .course-cover { font-size: 52px; }
            .course-title { font-size: 14px; min-height: 38px; }
        }
    </style>
</head>
<body>

<div class="app-layout">

    <!-- ============================================================
         左侧导航栏
         ============================================================ -->
    <aside class="sidebar">

        <div class="logo">
            <span class="logo-icon">🎯</span>
            <span class="logo-text">句游英语</span>
        </div>

        <nav>
            <div class="nav-group">
                <div class="nav-group-title">学习</div>
                <div class="nav-item" data-href="home.html">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </div>
                <div class="nav-item" data-href="learn.html">
                    <span class="nav-icon">▶️</span>
                    <span class="nav-text">开始学习</span>
                </div>
                <!-- 当前页：课程包商城 -->
                <div class="nav-item on" data-href="mall.html">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">课程包商城</span>
                </div>
                <div class="nav-item" data-href="archive.html">
                    <span class="nav-icon">🗂️</span>
                    <span class="nav-text">学习档案</span>
                </div>
                <div class="nav-item" data-href="growth.html">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">成长分析</span>
                </div>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">社交</div>
                <div class="nav-item" data-href="community.html">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">社区</span>
                </div>
                <div class="nav-item" data-href="community.html">
                    <span class="nav-icon">⚔️</span>
                    <span class="nav-text">PK 对战</span>
                </div>
                <div class="nav-item" data-href="community.html">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-text">排行榜</span>
                </div>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">我的</div>
                <div class="nav-item" data-href="profile.html">
                    <span class="nav-icon">👤</span>
                    <span class="nav-text">个人中心</span>
                </div>
                <div class="nav-item" data-href="promote.html">
                    <span class="nav-icon">💰</span>
                    <span class="nav-text">推广返佣</span>
                </div>
                <div class="nav-item" data-href="plugin.html">
                    <span class="nav-icon">🧩</span>
                    <span class="nav-text">浏览器插件</span>
                </div>
            </div>
        </nav>

        <div class="sidebar-bottom">
            <div class="vip-card" data-href="profile.html">
                <div class="vip-title">👑 升级会员</div>
                <div class="vip-desc">解锁全部课程<br>AI 助手无限次提问</div>
            </div>
        </div>

    </aside>

    <!-- ============================================================
         右侧主区域
         ============================================================ -->
    <div class="main-area">

        <header class="topbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="搜索课程包...">
            </div>

            <div class="topbar-right">
                <div class="streak-pill">
                    <span>🔥</span>
                    <span id="streakText">0 天</span>
                </div>
                <div class="topbar-icon-btn" data-tip="通知中心（后续步骤实现）">
                    🔔
                    <span class="badge-dot"></span>
                </div>
                <div class="topbar-icon-btn" data-tip="帮助中心（后续步骤实现）">❓</div>
                <div class="user-avatar" id="userAvatar" data-href="profile.html">学</div>
            </div>
        </header>

        <div class="content-scroll">

            <div class="page-header">
                <div class="page-title">课程商城</div>
                <div class="page-desc">近千个优质课程包，覆盖零基础、中小学、备考、实用英语等场景</div>
            </div>

            <div class="categories" id="categories">
                <div class="cat-chip on" data-cat="all">全部</div>
                <div class="cat-chip" data-cat="oral">实用口语</div>
                <div class="cat-chip" data-cat="school">中小学</div>
                <div class="cat-chip" data-cat="textbook">课本同步</div>
                <div class="cat-chip" data-cat="exam">应试备考</div>
                <div class="cat-chip" data-cat="business">商务职场</div>
                <div class="cat-chip" data-cat="hobby">兴趣爱好</div>
            </div>

            <div class="course-grid" id="courseGrid"></div>

        </div>

    </div>

</div>

<script>
/* ============================================================
   登录状态检查
   ============================================================ */
(function() {
    var userStr = localStorage.getItem('juyou_user');
    if (!userStr) {
        window.location.href = 'index.html';
        return;
    }
    var user = null;
    try {
        user = JSON.parse(userStr);
    } catch (e) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    if (!user || !user.phone) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    window.currentUser = user;
})();

/* ============================================================
   显示用户首字
   ============================================================ */
(function() {
    if (!window.currentUser) return;
    var nickname = window.currentUser.nickname || '学习者';
    var avatarEl = document.getElementById('userAvatar');
    if (avatarEl) avatarEl.textContent = nickname.slice(-1);
})();

/* ============================================================
   ★★★ 临时占位数据（后续会被 juyou-courses.js 替换）★★★
   ============================================================ */
var PLACEHOLDER_COURSES = [
    { courseId: 'kids_box_3',     title: "Kid's Box 3",        emoji: '🐻', grad: 1, level: '初级', learners: 2708 },
    { courseId: 'kids_box_2',     title: "Kid's Box 2",        emoji: '🎯', grad: 2, level: '初级', learners: 6384 },
    { courseId: 'fairy_tales',    title: '童话寓言故事',        emoji: '🦊', grad: 3, level: '初级', learners: 6703 },
    { courseId: 'kids_box_1',     title: "Kid's Box 1",        emoji: '📘', grad: 4, level: '初级', learners: 4156 },
    { courseId: 'chinese_fables', title: '中国成语寓言故事',     emoji: '🐢', grad: 5, level: '初级', learners: 3392 },
    { courseId: 'pep_grade4',     title: '人教版四上·单元重难点', emoji: '📕', grad: 6, level: '中级', learners: 1821 },
    { courseId: 'zoo_explorer',   title: '小小动物园探险家',     emoji: '🦁', grad: 7, level: '入门', learners: 1260 },
    { courseId: 'daily_oral',     title: '日常口语 900 句',      emoji: '💬', grad: 8, level: '初级', learners: 5140 }
];

/* ============================================================
   渲染课程网格
   ============================================================ */
function renderCourseGrid(list) {
    var grid = document.getElementById('courseGrid');
    if (!grid) return;

    if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:80px 20px; color:#999; font-size:14px;">没有找到课程</div>';
        return;
    }

    var html = '';
    list.forEach(function(c) {
        html +=
            '<div class="course-card" data-course="' + c.courseId + '">' +
                '<div class="course-cover cover-grad-' + c.grad + '">' +
                    c.emoji +
                '</div>' +
                '<div class="course-body">' +
                    '<div class="course-title">' + c.title + '</div>' +
                    '<div class="course-meta">' +
                        '<span class="course-level">' + c.level + '</span>' +
                        '<span class="course-learners">' + c.learners + '人学习</span>' +
                    '</div>' +
                '</div>' +
            '</div>';
    });
    grid.innerHTML = html;
}

/* ============================================================
   初始化 + 交互
   ============================================================ */
(function() {
    var grid = document.getElementById('courseGrid');
    var categoriesEl = document.getElementById('categories');
    var searchInput = document.getElementById('searchInput');

    var state = { cat: 'all', keyword: '' };

    function applyFilter() {
        var list = PLACEHOLDER_COURSES.filter(function(c) {
            if (state.keyword) {
                var kw = state.keyword.toLowerCase();
                if (c.title.toLowerCase().indexOf(kw) < 0) return false;
            }
            return true;
        });
        renderCourseGrid(list);
    }

    renderCourseGrid(PLACEHOLDER_COURSES);

    // 分类切换
    if (categoriesEl) {
        categoriesEl.addEventListener('click', function(e) {
            var chip = e.target.closest('.cat-chip');
            if (!chip) return;
            categoriesEl.querySelectorAll('.cat-chip').forEach(function(c) {
                c.classList.remove('on');
            });
            chip.classList.add('on');
            state.cat = chip.getAttribute('data-cat');
            applyFilter();
        });
    }

    // 搜索
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            state.keyword = this.value.trim();
            applyFilter();
        });
    }

    // 点击课程卡片 → 跳详情
    if (grid) {
        grid.addEventListener('click', function(e) {
            var card = e.target.closest('.course-card');
            if (!card) return;
            var courseId = card.getAttribute('data-course');
            if (!courseId) return;
            window.location.href = 'course.html?course=' + encodeURIComponent(courseId);
        });
    }

    // 页面跳转
    document.querySelectorAll('[data-href]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var href = this.getAttribute('data-href');
            if (!href) return;
            window.location.href = href;
        });
    });

    // data-tip
    document.querySelectorAll('[data-tip]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            alert(this.getAttribute('data-tip'));
        });
    });
})();
</script>

</body>
</html>
