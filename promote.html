<script>
/* ============================================================
   登录状态检查
   ============================================================ */
(function() {
    var userStr = localStorage.getItem('juyou_user');
    if (!userStr) {
        window.location.href = 'index.html';
        return;
    }
    var user = null;
    try {
        user = JSON.parse(userStr);
    } catch (e) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    if (!user || !user.phone) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    window.currentUser = user;
})();

/* ============================================================
   ★★★ 推广本地数据 JYPromote ★★★
   {
     joinedSpark: false,
     application: null | { name, contact, channel, scale, desc, timestamp },
     withdrawRecords: []
   }
   ============================================================ */
window.JYPromote = (function() {
    var KEY = 'juyou_promote';

    function getDefault() {
        return {
            joinedSpark: false,
            application: null,
            withdrawRecords: []
        };
    }

    function load() {
        try {
            var raw = localStorage.getItem(KEY);
            if (!raw) return getDefault();
            var data = JSON.parse(raw);
            var def = getDefault();
            return {
                joinedSpark: data.joinedSpark || false,
                application: data.application || null,
                withdrawRecords: data.withdrawRecords || []
            };
        } catch (e) {
            return getDefault();
        }
    }

    function save(data) {
        try {
            localStorage.setItem(KEY, JSON.stringify(data));
        } catch (e) {}
    }

    return { load: load, save: save };
})();

/* ============================================================
   工具函数
   ============================================================ */
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* ============================================================
   ★ 生成推荐码（基于手机号）
   ============================================================ */
function getMyCode() {
    var phone = (window.currentUser && window.currentUser.phone) || '';
    if (phone.length >= 6) {
        return 'JY' + phone.slice(-6);
    }
    return 'JY000000';
}

function getMyInviteUrl() {
    return 'https://juyouenglish.com/?ref=' + getMyCode();
}

/* ============================================================
   页面跳转（data-href）
   ============================================================ */
(function() {
    var currentPage = window.location.pathname.split('/').pop() || 'promote.html';
    document.querySelectorAll('[data-href]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var href = this.getAttribute('data-href');
            if (!href || href === currentPage) return;
            window.location.href = href;
        });
    });
})();

/* ============================================================
   ★ 初始化推荐码（替换 HTML 里的默认值）
   ============================================================ */
(function() {
    var code = getMyCode();
    var url = getMyInviteUrl();

    // 替换链接输入框
    var linkInput = document.getElementById('inviteLink');
    if (linkInput) {
        linkInput.value = url;
    }

    // 替换推荐码显示
    var codeEl = document.querySelector('.invite-code-text');
    if (codeEl) {
        codeEl.textContent = code;
    }
})();

/* ============================================================
   ★ 复制链接 / 复制推荐码
   ============================================================ */
(function() {
    function copyText(text, btn, originalText) {
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                showCopied(btn, originalText);
            }).catch(function() {
                fallbackCopy(text, btn, originalText);
            });
        } else {
            fallbackCopy(text, btn, originalText);
        }
    }

    function fallbackCopy(text, btn, originalText) {
        var temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        try {
            document.execCommand('copy');
            showCopied(btn, originalText);
        } catch (e) {
            alert('复制失败，请手动复制');
        }
        document.body.removeChild(temp);
    }

    function showCopied(btn, originalText) {
        btn.classList.add('copied');
        btn.textContent = '✓ 已复制';
        setTimeout(function() {
            btn.classList.remove('copied');
            btn.textContent = originalText;
        }, 2000);
    }

    var btnCopyLink = document.getElementById('btnCopyLink');
    if (btnCopyLink) {
        btnCopyLink.addEventListener('click', function(e) {
            e.stopPropagation();
            copyText(getMyInviteUrl(), this, '复制链接');
        });
    }

    var btnCopyCode = document.getElementById('btnCopyCode');
    if (btnCopyCode) {
        btnCopyCode.addEventListener('click', function(e) {
            e.stopPropagation();
            copyText(getMyCode(), this, '复制推荐码');
        });
    }
})();

/* ============================================================
   ★ 星火计划：立即加入
   ============================================================ */
(function() {
    var btn = document.querySelector('.btn-spark');
    if (!btn) return;

    btn.removeAttribute('data-tip');

    function updateBtnState() {
        var data = JYPromote.load();
        if (data.joinedSpark) {
            btn.textContent = '✓ 已加入星火计划';
            btn.style.background = 'rgba(255,255,255,0.85)';
            btn.style.cursor = 'default';
            btn.setAttribute('data-joined', '1');
        } else {
            btn.textContent = '🚀 立即加入';
            btn.style.background = '';
            btn.style.cursor = '';
            btn.removeAttribute('data-joined');
        }
    }

    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (btn.getAttribute('data-joined')) {
            alert('你已经在星火计划里啦～');
            return;
        }

        if (!confirm('确定加入星火计划？\n加入后即可开始推广赚佣金。')) return;

        var data = JYPromote.load();
        data.joinedSpark = true;
        JYPromote.save(data);
        updateBtnState();
        alert('🎉 已成功加入星火计划！\n你的专属邀请链接已就绪，快去分享吧～');
    });

    updateBtnState();
})();

/* ============================================================
   ★ 保存二维码：下载一个包含邀请链接的 txt 文件
   ============================================================ */
(function() {
    var btn = document.querySelector('.qr-block .btn-primary');
    if (!btn) return;

    btn.removeAttribute('data-tip');

    btn.addEventListener('click', function(e) {
        e.stopPropagation();

        var code = getMyCode();
        var url = getMyInviteUrl();

        var content =
            '【句游英语 - 我的专属邀请】\n\n' +
            '推荐码：' + code + '\n' +
            '邀请链接：' + url + '\n\n' +
            '好友通过此链接或推荐码注册，即成为你的下级合伙人。\n' +
            '好友开通会员，你最高可获得 50% 佣金返利！\n\n' +
            '—— 生成时间：' + new Date().toLocaleString('zh-CN');

        var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        var dlUrl = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = dlUrl;
        a.download = '句游英语-邀请码-' + code + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(function() {
            URL.revokeObjectURL(dlUrl);
        }, 1000);

        alert('✓ 邀请信息已下载到本地\n（文件名：句游英语-邀请码-' + code + '.txt）');
    });
})();

/* ============================================================
   ★ 佣金明细筛选（全部 / 已结算 / 待结算）
   ============================================================ */
(function() {
    // 找到"佣金明细"卡片里的 filter-chip
    var cards = document.querySelectorAll('.card');
    var targetCard = null;
    cards.forEach(function(c) {
        var title = c.querySelector('.card-title');
        if (title && title.textContent.indexOf('佣金明细') >= 0) {
            targetCard = c;
        }
    });
    if (!targetCard) return;

    var chips = targetCard.querySelectorAll('.filter-chip');
    var rows = targetCard.querySelectorAll('.data-table tbody tr');

    chips.forEach(function(chip) {
        chip.addEventListener('click', function(e) {
            e.stopPropagation();
            chips.forEach(function(c) { c.classList.remove('on'); });
            this.classList.add('on');

            var filterText = this.textContent.trim();

            rows.forEach(function(row) {
                var badge = row.querySelector('.status-badge');
                var status = badge ? badge.textContent.trim() : '';

                if (filterText === '全部') {
                    row.style.display = '';
                } else if (filterText === '已结算' && status.indexOf('已结算') >= 0) {
                    row.style.display = '';
                } else if (filterText === '待结算' && status.indexOf('待结算') >= 0) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    });
})();

/* ============================================================
   ★ 申请成为合伙人：表单提交 + 重置
   ============================================================ */
(function() {
    var formGrid = document.querySelector('.form-grid');
    if (!formGrid) return;

    var nameInput = formGrid.querySelector('input[type="text"]');
    var inputs = formGrid.querySelectorAll('input, select, textarea');
    var submitBtn = formGrid.querySelector('.btn-primary');
    var resetBtn = formGrid.querySelector('.btn-ghost');

    if (!submitBtn || !resetBtn) return;

    submitBtn.removeAttribute('data-tip');
    resetBtn.removeAttribute('data-tip');

    // 恢复已提交状态
    function restoreState() {
        var data = JYPromote.load();
        if (!data.application) return;

        var app = data.application;

        // 填充表单
        var textInputs = formGrid.querySelectorAll('input[type="text"]');
        if (textInputs[0]) textInputs[0].value = app.name || '';
        if (textInputs[1]) textInputs[1].value = app.contact || '';

        var selects = formGrid.querySelectorAll('select');
        if (selects[0]) selects[0].value = app.channel || selects[0].options[0].value;
        if (selects[1]) selects[1].value = app.scale || selects[1].options[0].value;

        var textarea = formGrid.querySelector('textarea');
        if (textarea) textarea.value = app.desc || '';

        // 禁用输入
        inputs.forEach(function(el) { el.disabled = true; });

        // 更新按钮
        submitBtn.textContent = '✓ 已提交，等待审核';
        submitBtn.style.background = '#e6f7ef';
        submitBtn.style.color = '#22a06b';
        submitBtn.style.boxShadow = 'none';
        submitBtn.setAttribute('data-submitted', '1');
    }

    // 提交
    submitBtn.addEventListener('click', function(e) {
        e.stopPropagation();

        if (submitBtn.getAttribute('data-submitted')) {
            alert('你的申请已提交，正在等待审核～');
            return;
        }

        var textInputs = formGrid.querySelectorAll('input[type="text"]');
        var name = (textInputs[0] ? textInputs[0].value : '').trim();
        var contact = (textInputs[1] ? textInputs[1].value : '').trim();

        if (!name) {
            alert('请填写姓名');
            if (textInputs[0]) textInputs[0].focus();
            return;
        }
        if (!contact) {
            alert('请填写联系方式');
            if (textInputs[1]) textInputs[1].focus();
            return;
        }

        var selects = formGrid.querySelectorAll('select');
        var channel = selects[0] ? selects[0].value : '';
        var scale = selects[1] ? selects[1].value : '';
        var textarea = formGrid.querySelector('textarea');
        var desc = textarea ? textarea.value.trim() : '';

        if (channel.indexOf('请选择') >= 0) {
            alert('请选择推广渠道');
            if (selects[0]) selects[0].focus();
            return;
        }

        var app = {
            name: name,
            contact: contact,
            channel: channel,
            scale: scale,
            desc: desc,
            timestamp: Date.now()
        };

        var data = JYPromote.load();
        data.application = app;
        JYPromote.save(data);

        // 禁用 + 改按钮
        inputs.forEach(function(el) { el.disabled = true; });
        submitBtn.textContent = '✓ 已提交，等待审核';
        submitBtn.style.background = '#e6f7ef';
        submitBtn.style.color = '#22a06b';
        submitBtn.style.boxShadow = 'none';
        submitBtn.setAttribute('data-submitted', '1');

        alert('✅ 申请已提交！\n官方将在 1-3 个工作日内审核，请留意通知。');
    });

    // 重置
    resetBtn.addEventListener('click', function(e) {
        e.stopPropagation();

        var isSubmitted = submitBtn.getAttribute('data-submitted');

        if (isSubmitted) {
            if (!confirm('撤销已提交的申请并重新填写？')) return;
            var data = JYPromote.load();
            data.application = null;
            JYPromote.save(data);

            inputs.forEach(function(el) { el.disabled = false; });
            submitBtn.textContent = '提交申请';
            submitBtn.style.background = '';
            submitBtn.style.color = '';
            submitBtn.style.boxShadow = '';
            submitBtn.removeAttribute('data-submitted');
        } else {
            if (!confirm('确定重置表单吗？')) return;
        }

        // 清空所有
        inputs.forEach(function(el) {
            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0;
            } else {
                el.value = '';
            }
        });
    });

    restoreState();
})();

/* ============================================================
   其他 filter-chip（非佣金明细的）保持单选视觉
   ============================================================ */
(function() {
    var containers = new Set();
    document.querySelectorAll('.filter-chip').forEach(function(chip) {
        // 跳过佣金明细里的（已单独处理）
        var card = chip.closest('.card');
        if (card) {
            var title = card.querySelector('.card-title');
            if (title && title.textContent.indexOf('佣金明细') >= 0) return;
        }
        containers.add(chip.parentElement);
    });

    containers.forEach(function(container) {
        var chips = container.querySelectorAll('.filter-chip');
        chips.forEach(function(chip) {
            chip.addEventListener('click', function(e) {
                e.stopPropagation();
                chips.forEach(function(c) { c.classList.remove('on'); });
                this.classList.add('on');
            });
        });
    });
})();

/* ============================================================
   data-tip 提示（排除已接管功能的元素）
   ============================================================ */
(function() {
    document.querySelectorAll('[data-tip]').forEach(function(el) {
        // 排除已接管的
        if (el.classList.contains('btn-spark')) return;
        if (el.closest('.qr-block')) return;
        if (el.closest('.form-grid')) return;

        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var tip = this.getAttribute('data-tip');
            if (tip) alert(tip);
        });
    });
})();
</script>
