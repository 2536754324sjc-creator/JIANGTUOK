<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载课程 - 句游英语</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #f5f7fb 0%, #eef2ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .load-wrap {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* 课程封面（浮动动画） */
        .load-cover {
            width: 108px;
            height: 108px;
            margin: 0 auto 22px;
            border-radius: 26px;
            background: linear-gradient(135deg, #eef2ff, #dfe7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            box-shadow: 0 16px 40px rgba(79, 110, 247, 0.18);
            animation: coverFloat 2.6s ease-in-out infinite;
        }
        @keyframes coverFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .load-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .load-sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 28px;
        }

        /* 进度条 */
        .load-track {
            width: 100%;
            height: 10px;
            background: #e2e8f5;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .load-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #4f6ef7, #7b8fff);
            transition: width 0.3s ease;
        }

        .load-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #888;
            margin-bottom: 26px;
        }
        .load-info #loadPct { color: #4f6ef7; font-weight: 700; }

        /* 加载点动画 */
        .load-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 20px;
            height: 10px;
        }
        .load-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4f6ef7;
            opacity: 0.35;
            animation: dotJump 1.2s ease-in-out infinite;
        }
        .load-dots span:nth-child(2) { animation-delay: 0.15s; }
        .load-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotJump {
            0%, 100% { transform: translateY(0); opacity: 0.35; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        .load-status {
            font-size: 13px;
            color: #888;
            min-height: 20px;
            margin-bottom: 22px;
        }
        .load-status.warn { color: #ff9f43; }

        /* 跳过按钮 */
        .load-skip {
            border: none;
            background: none;
            font-family: inherit;
            font-size: 14px;
            color: #4f6ef7;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .load-skip:hover { background: rgba(79, 110, 247, 0.08); }
        .load-skip.primary {
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
            font-weight: 600;
            padding: 12px 30px;
            box-shadow: 0 6px 18px rgba(79, 110, 247, 0.3);
        }
        .load-skip.primary:hover { opacity: 0.92; }

        .load-tip {
            margin-top: 30px;
            font-size: 12px;
            color: #b3bdd1;
        }
    </style>
</head>
<body>

    <div class="load-wrap">
        <div class="load-cover" id="loadCover">📘</div>
        <div class="load-title" id="loadTitle">正在打开课程…</div>
        <div class="load-sub" id="loadSub">首次进入需要缓存课程语音，请稍候</div>

        <div class="load-track"><div class="load-fill" id="loadFill"></div></div>
        <div class="load-info">
            <span id="loadCount">0 / 0 句</span>
            <span id="loadPct">0%</span>
        </div>

        <div class="load-dots"><span></span><span></span><span></span></div>
        <div class="load-status" id="loadStatus"></div>

        <button class="load-skip" id="skipBtn" type="button">跳过，直接进入 →</button>

        <div class="load-tip">缓存完成后，听写页发音可秒播</div>
    </div>

    <script src="assets/jy-audio.js"></script>
    <script src="data/juyou-courses-registry.js"></script>
    <script src="data/juyou-courses-content.js"></script>
    <script>
    /* ============================================================
       课程加载页：预缓存全课程语音 → 完成后进入听写页
       - 语音链路：有道 → 百度/Google → 系统 TTS（引擎 JYAudio 内部处理）
       - 限并发 3，最多等待 12 秒，也可随时点"跳过"
       - 跳转用 location.replace 替换历史条目：
         退出听写时 history.back() 回到课程页，不会再回到本页造成循环
       ============================================================ */
    (function() {
        'use strict';

        var params = new URLSearchParams(window.location.search);
        var courseId = params.get('course') || '';
        var lesson = params.get('lesson') || '1';

        var elCover = document.getElementById('loadCover');
        var elTitle = document.getElementById('loadTitle');
        var elSub = document.getElementById('loadSub');
        var elFill = document.getElementById('loadFill');
        var elCount = document.getElementById('loadCount');
        var elPct = document.getElementById('loadPct');
        var elStatus = document.getElementById('loadStatus');
        var elSkip = document.getElementById('skipBtn');

        var CONCURRENCY = 3;
        var MAX_WAIT_MS = 12000;

        var finished = false;

        function proceed() {
            if (finished) return;
            finished = true;
            /* ★ replace 而非 href：把本页从历史记录中替换掉，
               听写页点"退出听写" history.back() 时回到课程页，
               不会再回到本页重新加载（修复死循环 BUG） */
            window.location.replace('dictation.html?course=' +
                encodeURIComponent(courseId) + '&lesson=' + encodeURIComponent(lesson));
        }

        /* 收集该课程全部句子 */
        var sentences = [];
        var course = window.JY_COURSES ? window.JY_COURSES.get(courseId) : null;
        var content = window.JY_COURSE_CONTENT ? window.JY_COURSE_CONTENT[courseId] : null;

        if (course) {
            elTitle.textContent = course.title;
            elCover.textContent = course.emoji || '📘';
        } else {
            elTitle.textContent = '课程加载中…';
        }

        if (content && content.units) {
            content.units.forEach(function(u) {
                (u.sentences || []).forEach(function(s) {
                    if (s.en) sentences.push(s.en);
                });
            });
        }

        var total = sentences.length;

        function updateUI(doneCount, failCount) {
            var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
            elFill.style.width = pct + '%';
            elCount.textContent = doneCount + ' / ' + total + ' 句';
            elPct.textContent = pct + '%';
            if (failCount > 0) {
                elStatus.textContent = '已有 ' + failCount + ' 句语音获取失败（进入后用系统语音朗读）';
                elStatus.classList.add('warn');
            }
        }

        /* 没有句子数据 → 直接进听写（听写页会显示对应提示） */
        if (total === 0) {
            elSub.textContent = '即将进入…';
            setTimeout(proceed, 400);
            return;
        }

        var doneCount = 0;
        var failCount = 0;

        function onAllDone() {
            elStatus.classList.remove('warn');
            if (failCount === 0) {
                elStatus.textContent = '✓ 语音准备完成，正在进入…';
            } else {
                elStatus.textContent = '✓ 真人语音不可用 ' + failCount + ' 句，进入后用系统语音朗读';
            }
            elSub.textContent = '加载完成';
            setTimeout(proceed, 600);
        }

        /* 超时保护：等太久就先放行，剩余语音听写页后台继续加载 */
        setTimeout(function() {
            if (finished) return;
            elStatus.textContent = '网络较慢，先去学习吧（剩余语音后台继续加载）';
            elStatus.classList.add('warn');
            elSkip.textContent = '进入听写 →';
            elSkip.classList.add('primary');
        }, MAX_WAIT_MS);

        elSkip.addEventListener('click', proceed);

        updateUI(0, 0);

        /* ★ 通过 JYAudio 引擎预加载：
           每个句子自动按 有道 → 百度 → Google 顺序尝试，全部失败才记为失败；
           成功的音频常驻内存，进入听写页后同会话播放秒开 */
        JYAudio.prefetchAll(sentences, {
            concurrency: CONCURRENCY,
            timeoutMs: MAX_WAIT_MS,
            onProgress: function(done, total2, ok) {
                doneCount = done;
                if (!ok) failCount++;
                updateUI(doneCount, failCount);
            },
            onTimeout: function(done, total2) {
                /* 超时不强制放行：按钮已变为"进入听写 →"，用户可随时点击 */
            },
            onDone: onAllDone
        });
    })();
    </script>

</body>
</html>
