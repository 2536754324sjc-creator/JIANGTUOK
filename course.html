    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #333;
            min-height: 100vh;
        }

        :root {
            --brand: #4f6ef7;
            --brand-light: #7b8fff;
            --text-main: #1a1a2e;
            --text-sub: #666;
            --text-mute: #999;
            --border: #eef1f8;
        }

        a { text-decoration: none; color: inherit; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d8dfee; border-radius: 99px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .app-layout { display: flex; min-height: 100vh; }

        /* 侧边栏（同其他页面） */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--brand);
            padding: 0 12px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-group { margin-bottom: 8px; }

        .nav-group-title {
            font-size: 11px;
            color: #bbb;
            padding: 8px 12px;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 2px;
        }

        .nav-item:hover { background: #f4f6fc; color: var(--brand); }
        .nav-item.on { background: #eef2ff; color: var(--brand); font-weight: 600; }

        .nav-item .nav-icon {
            font-size: 17px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-bottom { margin-top: auto; padding-top: 16px; }

        .vip-card {
            background: linear-gradient(135deg, #4f6ef7, #7b8fff);
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .vip-card .vip-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .vip-card .vip-desc { font-size: 11px; opacity: 0.85; line-height: 1.5; }

        /* 主区域 */
        .main-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover { background: #f4f6fc; color: var(--brand); }

        .topbar-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            color: var(--text-sub);
            transition: background 0.2s;
            position: relative;
        }

        .topbar-icon-btn:hover { background: #f4f6fc; }

        .badge-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            background: #ff5b5b;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f6ef7, #7b8fff);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 内容区 */
        .content-scroll { padding: 24px 28px 100px; }

        .content-wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 顶部封面卡（左侧图，右侧信息） */
        .hero-block {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
        }

        .hero-cover {
            width: 320px;
            min-height: 220px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            position: relative;
            overflow: hidden;
        }

        .hero-cover .cover-grad-1 { position: absolute; inset: 0; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .hero-cover .cover-grad-2 { position: absolute; inset: 0; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .hero-cover .cover-grad-3 { position: absolute; inset: 0; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .hero-cover .cover-grad-4 { position: absolute; inset: 0; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .hero-cover .cover-grad-5 { position: absolute; inset: 0; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .hero-cover .cover-grad-6 { position: absolute; inset: 0; background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%); }
        .hero-cover .cover-grad-7 { position: absolute; inset: 0; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .hero-cover .cover-grad-8 { position: absolute; inset: 0; background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }

        .hero-emoji {
            position: relative;
            z-index: 1;
            font-size: 100px;
            line-height: 1;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.15));
        }

        .hero-info {
            flex: 1;
            min-width: 260px;
            padding: 26px 28px;
            display: flex;
            flex-direction: column;
        }

        .hero-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .hero-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .hero-tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            background: #eef2ff;
            color: var(--brand);
        }

        .hero-tag.green {
            background: #ecfdf5;
            color: #16a34a;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
            margin-top: auto;
        }

        .hs-item {
            background: #f8faff;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .hs-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
        }

        .hs-value .unit {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-mute);
            margin-left: 2px;
        }

        .hs-label {
            font-size: 12px;
            color: var(--text-mute);
            margin-top: 4px;
        }

        /* 描述卡 */
        .desc-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 22px 26px;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            margin-bottom: 16px;
            font-size: 14px;
            color: #4a4a5e;
            line-height: 1.85;
            letter-spacing: 0.2px;
        }

        /* 会员提示 */
        .member-hint {
            background: #fff8ec;
            border: 1px solid #ffe3c2;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .member-hint .crown {
            font-size: 20px;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .member-hint .hint-text {
            flex: 1;
            font-size: 13px;
            color: #d97706;
            line-height: 1.7;
            font-weight: 500;
        }

        /* 课程目录 */
        .catalog-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 22px 24px 20px;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
        }

        .catalog-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .catalog-head .head-icon { font-size: 18px; }

        /* 单元卡片 */
        .unit-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        .unit-card:hover {
            border-color: #c9d4f5;
        }

        .unit-card.expanded {
            border-color: #c9d4f5;
            box-shadow: 0 4px 16px rgba(79, 110, 247, 0.08);
        }

        .unit-head {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            cursor: pointer;
            user-select: none;
        }

        .unit-no {
            font-size: 24px;
            font-weight: 800;
            color: #c9d0e0;
            font-style: italic;
            min-width: 40px;
            text-align: center;
            flex-shrink: 0;
            letter-spacing: -1px;
            line-height: 1;
            transition: color 0.2s;
        }

        .unit-card.expanded .unit-no { color: var(--brand); }

        .unit-info {
            flex: 1;
            min-width: 0;
        }

        .unit-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .unit-desc {
            font-size: 12.5px;
            color: var(--text-mute);
            line-height: 1.55;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .unit-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .unit-count {
            font-size: 13px;
            color: var(--text-mute);
            white-space: nowrap;
        }

        .unit-arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f4f6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-sub);
            transition: transform 0.3s, background 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .unit-card.expanded .unit-arrow {
            transform: rotate(180deg);
            background: #eef2ff;
            color: var(--brand);
        }

        .unit-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .unit-card.expanded .unit-body {
            max-height: 1400px;
        }

        .unit-body-inner {
            padding: 4px 20px 22px;
            border-top: 1px solid var(--border);
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin: 18px 0 10px;
        }

        .section-label:first-child { margin-top: 16px; }

        .section-label .sl-icon { font-size: 14px; }

        .tag-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-purple {
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 8px;
            background: #eef2ff;
            color: var(--brand);
            font-weight: 500;
            line-height: 1.4;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .tag-purple:hover { background: #dfe7ff; }
        .tag-purple:active { transform: scale(0.96); }

        .tag-green {
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #16a34a;
            font-weight: 500;
            line-height: 1.6;
            display: block;
            width: 100%;
            margin-bottom: 6px;
        }

        /* 底部固定按钮 */
        .bottom-bar {
            position: fixed;
            left: 220px;
            right: 0;
            bottom: 0;
            background: #ffffff;
            padding: 14px 28px;
            box-shadow: 0 -4px 20px rgba(20, 40, 90, 0.06);
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .join-btn {
            width: 100%;
            max-width: 1044px;
            height: 50px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(79, 110, 247, 0.35);
            font-family: inherit;
        }

        .join-btn:hover { opacity: 0.92; }
        .join-btn:active { transform: scale(0.99); }
        .join-btn.joined {
            background: #e6f7ef;
            color: #22a06b;
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 14px;
        }

        .empty-state .es-icon {
            font-size: 52px;
            opacity: 0.4;
            margin-bottom: 14px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .sidebar { width: 64px; padding: 16px 8px; }
            .sidebar .logo { font-size: 0; justify-content: center; padding: 0; }
            .sidebar .logo .logo-icon { font-size: 22px; }
            .nav-item { justify-content: center; padding: 12px 0; }
            .nav-item .nav-text { display: none; }
            .nav-group-title { display: none; }
            .vip-card { display: none; }
            .content-scroll { padding: 16px 14px 100px; }
            .topbar { padding: 12px 14px; }
            .hero-cover { width: 100%; min-height: 180px; }
            .hero-emoji { font-size: 80px; }
            .hero-info { padding: 20px; }
            .hero-title { font-size: 20px; }
            .bottom-bar { left: 64px; padding: 12px 14px; }
            .unit-head { padding: 14px; gap: 12px; }
            .unit-no { font-size: 20px; min-width: 32px; }
            .unit-body-inner { padding: 4px 14px 18px; }
            .desc-card { padding: 18px; }
        }
    </style>
</head>

<script>
/* ============================================================
   登录状态检查
   ============================================================ */
(function() {
    var userStr = localStorage.getItem('juyou_user');
    if (!userStr) {
        window.location.href = 'index.html';
        return;
    }
    var user = null;
    try {
        user = JSON.parse(userStr);
    } catch (e) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    if (!user || !user.phone) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    window.currentUser = user;
})();

/* ============================================================
   显示用户首字
   ============================================================ */
(function() {
    if (!window.currentUser) return;
    var nickname = window.currentUser.nickname || '学习者';
    var avatarEl = document.getElementById('userAvatar');
    if (avatarEl) avatarEl.textContent = nickname.slice(-1);
})();

/* ============================================================
   读 URL 参数
   ============================================================ */
function getUrlParam(name) {
    var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
}

var COURSE_ID = getUrlParam('course');

/* ============================================================
   渲染详情页
   ============================================================ */
function renderDetail(data) {
    var container = document.getElementById('detailContent');
    if (!container) return;

    if (!data) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<div class="es-icon">📭</div>' +
                '<div>没有找到该课程</div>' +
            '</div>';
        return;
    }

    // 封面 + 信息
    var heroHtml =
        '<div class="hero-block">' +
            '<div class="hero-cover">' +
                '<div class="cover-grad-' + data.grad + '"></div>' +
                '<div class="hero-emoji">' + data.emoji + '</div>' +
            '</div>' +
            '<div class="hero-info">' +
                '<div class="hero-title">' + data.title + '</div>' +
                '<div class="hero-tags">' +
                    '<span class="hero-tag green">' + data.level + '</span>' +
                    '<span class="hero-tag">👤 ' + data.learners + ' 人在学</span>' +
                '</div>' +
                '<div class="hero-stats">' +
                    '<div class="hs-item">' +
                        '<div class="hs-value">' + data.unitCount + '<span class="unit">个</span></div>' +
                        '<div class="hs-label">课节数</div>' +
                    '</div>' +
                    '<div class="hs-item">' +
                        '<div class="hs-value">' + data.sentenceCount + '<span class="unit">句</span></div>' +
                        '<div class="hs-label">总句子数</div>' +
                    '</div>' +
                '</div>' +
            '</div>' +
        '</div>';

    // 描述
    var descHtml = '<div class="desc-card">' + data.description + '</div>';

    // 会员提示
    var memberHtml = '';
    if (data.isMemberOnly) {
        memberHtml =
            '<div class="member-hint">' +
                '<span class="crown">👑</span>' +
                '<div class="hint-text">该课程面向正式付费会员，您可以添加并试学第一节课</div>' +
            '</div>';
    }

    // 课程目录
    var catalogHtml = '<div class="catalog-section">' +
        '<div class="catalog-head"><span class="head-icon">📋</span><span>课程目录</span></div>';

    data.units.forEach(function(unit, idx) {
        var noStr = (idx + 1 < 10 ? '0' : '') + (idx + 1);

        var vocabTags = (unit.vocabulary || []).map(function(w) {
            return '<span class="tag-purple">' + w + '</span>';
        }).join('');

        var phraseTags = (unit.phrases || []).map(function(p) {
            return '<span class="tag-purple">' + p + '</span>';
        }).join('');

        var grammarTags = (unit.grammar || []).map(function(g) {
            return '<span class="tag-green">' + g + '</span>';
        }).join('');

        catalogHtml +=
            '<div class="unit-card" data-unit="' + unit.unit_id + '">' +
                '<div class="unit-head">' +
                    '<div class="unit-no">' + noStr + '</div>' +
                    '<div class="unit-info">' +
                        '<div class="unit-title">' + unit.title + '</div>' +
                        '<div class="unit-desc">' + unit.desc + '</div>' +
                    '</div>' +
                    '<div class="unit-right">' +
                        '<span class="unit-count">' + unit.sentenceCount + ' 句</span>' +
                        '<span class="unit-arrow">▾</span>' +
                    '</div>' +
                '</div>' +
                '<div class="unit-body">' +
                    '<div class="unit-body-inner">' +

                        '<div class="section-label"><span class="sl-icon">📕</span><span>核心词汇</span></div>' +
                        '<div class="tag-wrap">' + vocabTags + '</div>' +

                        '<div class="section-label"><span class="sl-icon">📗</span><span>核心短语</span></div>' +
                        '<div class="tag-wrap">' + phraseTags + '</div>' +

                        '<div class="section-label"><span class="sl-icon">📘</span><span>语法结构</span></div>' +
                        '<div class="tag-wrap">' + grammarTags + '</div>' +

                    '</div>' +
                '</div>' +
            '</div>';
    });

    catalogHtml += '</div>';

    container.innerHTML = heroHtml + descHtml + memberHtml + catalogHtml;

    // 单元展开/收起（手风琴）
    container.querySelectorAll('.unit-card').forEach(function(card) {
        var head = card.querySelector('.unit-head');
        if (!head) return;
        head.addEventListener('click', function() {
            var wasOpen = card.classList.contains('expanded');
            container.querySelectorAll('.unit-card').forEach(function(c) {
                c.classList.remove('expanded');
            });
            if (!wasOpen) {
                card.classList.add('expanded');
                setTimeout(function() {
                    var rect = card.getBoundingClientRect();
                    if (rect.top < 80) {
                        window.scrollTo({
                            top: window.pageYOffset + rect.top - 80,
                            behavior: 'smooth'
                        });
                    }
                }, 360);
            }
        });
    });
}

/* ============================================================
   初始化
   ============================================================ */
(function() {
    renderDetail(PLACEHOLDER_DETAIL);

    // 返回
    document.getElementById('backBtn').addEventListener('click', function() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'mall.html';
        }
    });

    // 加入课程库（临时）
    var joinBtn = document.getElementById('joinBtn');
    joinBtn.addEventListener('click', function() {
        if (this.classList.contains('joined')) {
            alert('已经在你的课程库里啦～');
            return;
        }
        this.classList.add('joined');
        this.textContent = '✓ 已加入课程库';
        alert('已加入课程库！\n（后续版本会同步到"我的课程"）');
    });

    // 页面跳转
    document.querySelectorAll('[data-href]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var href = this.getAttribute('data-href');
            if (!href) return;
            window.location.href = href;
        });
    });

    // data-tip
    document.querySelectorAll('[data-tip]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            alert(this.getAttribute('data-tip'));
        });
    });
})();
</script>
