<script>
/* ============================================================
   登录状态检查
   ============================================================ */
(function() {
    var userStr = localStorage.getItem('juyou_user');
    if (!userStr) {
        window.location.href = 'index.html';
        return;
    }
    var user = null;
    try {
        user = JSON.parse(userStr);
    } catch (e) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    if (!user || !user.phone) {
        localStorage.removeItem('juyou_user');
        window.location.href = 'index.html';
        return;
    }
    window.currentUser = user;
})();

/* ============================================================
   ★★★ 插件本地数据 JYPlugin ★★★
   {
     onWaitlist: false,
     tutorialViews: 0,
     scenesExpanded: false
   }
   ============================================================ */
window.JYPlugin = (function() {
    var KEY = 'juyou_plugin';

    function getDefault() {
        return {
            onWaitlist: false,
            tutorialViews: 0,
            scenesExpanded: false
        };
    }

    function load() {
        try {
            var raw = localStorage.getItem(KEY);
            if (!raw) return getDefault();
            var data = JSON.parse(raw);
            var def = getDefault();
            return {
                onWaitlist: data.onWaitlist || false,
                tutorialViews: data.tutorialViews || 0,
                scenesExpanded: data.scenesExpanded || false
            };
        } catch (e) {
            return getDefault();
        }
    }

    function save(data) {
        try {
            localStorage.setItem(KEY, JSON.stringify(data));
        } catch (e) {}
    }

    return { load: load, save: save };
})();

/* ============================================================
   页面跳转（data-href）
   ============================================================ */
(function() {
    var currentPage = window.location.pathname.split('/').pop() || 'plugin.html';
    document.querySelectorAll('[data-href]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var href = this.getAttribute('data-href');
            if (!href || href === currentPage) return;
            window.location.href = href;
        });
    });
})();

/* ============================================================
   ★★★ 等待列表：Hero 和 底部 CTA 按钮同步 ★★★
   ============================================================ */
(function() {
    var heroBtn = document.querySelector('.btn-hero.primary');
    var ctaBtn = document.querySelector('.cta-btn.white');

    function applyState(btn, isHero) {
        if (!btn) return;

        var data = JYPlugin.load();
        var textSpan = btn.querySelector('span:last-child');
        var iconSpan = btn.querySelector('span:first-child');

        if (data.onWaitlist) {
            btn.setAttribute('data-joined', '1');
            btn.style.opacity = '0.85';
            btn.style.cursor = 'default';
            if (iconSpan) iconSpan.textContent = '✓';
            if (textSpan) textSpan.textContent = isHero ? '已加入等待' : '已加入等待列表';
        } else {
            btn.removeAttribute('data-joined');
            btn.style.opacity = '';
            btn.style.cursor = '';
            if (iconSpan) iconSpan.textContent = '⬇️';
            if (textSpan) textSpan.textContent = isHero ? '免费安装' : '免费安装插件';
        }
    }

    function updateAll() {
        applyState(heroBtn, true);
        applyState(ctaBtn, false);
    }

    function onInstallClick(e) {
        e.stopPropagation();

        var data = JYPlugin.load();
        if (data.onWaitlist) {
            alert('你已经在等待列表里啦～\n插件上架时会第一时间通知你。');
            return;
        }

        if (!confirm('插件目前正在开发中，暂未上架 Chrome 商店。\n\n加入等待列表，上架时第一时间通知你？')) {
            return;
        }

        data.onWaitlist = true;
        JYPlugin.save(data);
        updateAll();

        alert('✓ 已加入等待列表！\n插件上架后会通过站内通知提醒你。');
    }

    if (heroBtn) {
        heroBtn.removeAttribute('data-tip');
        heroBtn.addEventListener('click', onInstallClick);
    }
    if (ctaBtn) {
        ctaBtn.removeAttribute('data-tip');
        ctaBtn.addEventListener('click', onInstallClick);
    }

    updateAll();
})();

/* ============================================================
   ★★★ 使用教程弹层（自建 Modal） ★★★
   ============================================================ */
function showTutorialModal() {
    // 防重复
    var existing = document.getElementById('__jy_tutorial_modal');
    if (existing) existing.remove();

    // 记录访问次数
    var data = JYPlugin.load();
    data.tutorialViews = (data.tutorialViews || 0) + 1;
    JYPlugin.save(data);

    var mask = document.createElement('div');
    mask.id = '__jy_tutorial_modal';
    mask.style.cssText = [
        'position:fixed',
        'inset:0',
        'background:rgba(20,30,60,0.45)',
        'z-index:9999',
        'display:flex',
        'align-items:center',
        'justify-content:center',
        'padding:20px',
        'backdrop-filter:blur(3px)',
        '-webkit-backdrop-filter:blur(3px)',
        'animation:__jyFadeIn 0.25s ease-out'
    ].join(';');

    var box = document.createElement('div');
    box.style.cssText = [
        'background:#fff',
        'border-radius:20px',
        'padding:32px 36px',
        'max-width:540px',
        'width:100%',
        'max-height:85vh',
        'overflow-y:auto',
        'box-shadow:0 24px 60px rgba(0,0,0,0.25)',
        'position:relative',
        'animation:__jyPopIn 0.3s ease-out'
    ].join(';');

    box.innerHTML = '' +
        '<button id="__jy_tut_close" style="position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#f4f6fc;border:none;color:#666;font-size:15px;cursor:pointer;">✕</button>' +
        '<h3 style="font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:6px;display:flex;align-items:center;gap:8px;">📖 使用教程</h3>' +
        '<p style="font-size:13px;color:#999;margin-bottom:24px;">3 步完成安装，马上开始收集</p>' +
        '<div style="display:flex;flex-direction:column;gap:18px;">' +
            '<div style="display:flex;gap:14px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:15px;">1</div>' +
                '<div style="flex:1;">' +
                    '<div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">打开 Chrome 应用商店</div>' +
                    '<div style="font-size:13px;color:#666;line-height:1.7;">在 Chrome 浏览器访问 Chrome 应用商店，搜索「句游小句子」。</div>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;gap:14px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:15px;">2</div>' +
                '<div style="flex:1;">' +
                    '<div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">添加到 Chrome</div>' +
                    '<div style="font-size:13px;color:#666;line-height:1.7;">点击「添加至 Chrome」，弹窗确认「添加扩展程序」，等待 3 秒安装完成。</div>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;gap:14px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:15px;">3</div>' +
                '<div style="flex:1;">' +
                    '<div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">开始收集</div>' +
                    '<div style="font-size:13px;color:#666;line-height:1.7;">登录句游英语账号，在任意英文网页选中文字，右侧会弹出「收集」按钮，点击即保存。</div>' +
                '</div>' +
            '</div>' +
        '</div>' +
        '<div style="margin-top:26px;padding:14px 18px;background:#fff8ec;border-radius:12px;border:1px solid #ffe0b2;font-size:12px;color:#7a4a00;line-height:1.6;">' +
            '💡 插件目前正在开发中，加入等待列表后会在上架时第一时间通知你。' +
        '</div>';

    mask.appendChild(box);
    document.body.appendChild(mask);

    // 注入一次性动画
    if (!document.getElementById('__jy_tut_style')) {
        var style = document.createElement('style');
        style.id = '__jy_tut_style';
        style.textContent =
            '@keyframes __jyFadeIn { from{opacity:0} to{opacity:1} }' +
            '@keyframes __jyPopIn { from{opacity:0;transform:translateY(20px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }';
        document.head.appendChild(style);
    }

    function close() {
        mask.style.opacity = '0';
        mask.style.transition = 'opacity 0.2s';
        setTimeout(function() {
            if (mask.parentNode) mask.parentNode.removeChild(mask);
        }, 200);
        document.removeEventListener('keydown', escHandler);
    }

    document.getElementById('__jy_tut_close').addEventListener('click', close);
    mask.addEventListener('click', function(e) {
        if (e.target === mask) close();
    });

    var escHandler = function(e) {
        if (e.key === 'Escape') close();
    };
    document.addEventListener('keydown', escHandler);
}

/* ============================================================
   ★ 接管"使用教程"按钮
   ============================================================ */
(function() {
    var heroTutBtn = document.querySelector('.btn-hero.secondary');
    var ctaTutBtn = document.querySelector('.cta-btn.outline');

    if (heroTutBtn) {
        heroTutBtn.removeAttribute('data-tip');
        heroTutBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showTutorialModal();
        });
    }
    if (ctaTutBtn) {
        ctaTutBtn.removeAttribute('data-tip');
        ctaTutBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showTutorialModal();
        });
    }
})();

/* ============================================================
   ★★★ "更多 →"（使用场景）展开更多场景 ★★★
   ============================================================ */
(function() {
    // 找到"使用场景"卡片
    var targetCard = null;
    document.querySelectorAll('.card').forEach(function(card) {
        var titleEl = card.querySelector('.card-title');
        if (titleEl && titleEl.textContent.indexOf('使用场景') >= 0) {
            targetCard = card;
        }
    });
    if (!targetCard) return;

    var moreBtn = targetCard.querySelector('.card-more');
    var sceneList = targetCard.querySelector('.scene-list');
    if (!moreBtn || !sceneList) return;

    moreBtn.removeAttribute('data-tip');

    // 额外场景数据
    var extraScenes = [
        {
            icon: '🎙️',
            title: '播客 / 有声书',
            desc: '听英文播客时收集精彩段落，附带音频时间戳，复习时直接跳转。'
        },
        {
            icon: '💼',
            title: 'LinkedIn / 邮件',
            desc: '看到地道商务表达，一键收集到职场课程包，随时练习写作。'
        },
        {
            icon: '📚',
            title: '电子书阅读',
            desc: 'Kindle、Apple Books 等阅读器同样支持，收集你喜欢的句子和段落。'
        },
        {
            icon: '🎓',
            title: '在线课程笔记',
            desc: 'Coursera、edX 看课时，随手收集重要概念和例句，形成专属词库。'
        }
    ];

    var isExpanded = false;

    function expand() {
        if (isExpanded) return;
        isExpanded = true;

        extraScenes.forEach(function(scene, i) {
            var item = document.createElement('div');
            item.className = 'scene-item';
            item.style.opacity = '0';
            item.style.transform = 'translateY(-8px)';
            item.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            item.innerHTML =
                '<div class="si-icon">' + scene.icon + '</div>' +
                '<div class="si-body">' +
                    '<div class="si-title">' + scene.title + '</div>' +
                    '<div class="si-desc">' + scene.desc + '</div>' +
                '</div>';
            sceneList.appendChild(item);

            setTimeout(function() {
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, 50 + i * 80);
        });

        moreBtn.textContent = '收起 ↑';

        // 持久化
        var data = JYPlugin.load();
        data.scenesExpanded = true;
        JYPlugin.save(data);
    }

    function collapse() {
        isExpanded = false;
        var items = sceneList.querySelectorAll('.scene-item');
        // 只删后 4 个（额外加的）
        var total = items.length;
        for (var i = total - 1; i >= total - extraScenes.length; i--) {
            items[i].remove();
        }
        moreBtn.textContent = '更多 →';

        var data = JYPlugin.load();
        data.scenesExpanded = false;
        JYPlugin.save(data);
    }

    moreBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isExpanded) {
            collapse();
        } else {
            expand();
        }
    });

    // 恢复上次的展开状态
    var data = JYPlugin.load();
    if (data.scenesExpanded) {
        expand();
    }
})();

/* ============================================================
   data-tip 提示（排除已接管功能的按钮）
   ============================================================ */
(function() {
    document.querySelectorAll('[data-tip]').forEach(function(el) {
        // 排除已接管的
        if (el.classList.contains('btn-hero')) return;
        if (el.classList.contains('cta-btn')) return;
        if (el.closest('.card') && el.classList.contains('card-more')) {
            var titleEl = el.closest('.card').querySelector('.card-title');
            if (titleEl && titleEl.textContent.indexOf('使用场景') >= 0) return;
        }

        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var tip = this.getAttribute('data-tip');
            if (tip) alert(tip);
        });
    });
})();
</script>
