<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句游英语 - 我的课程</title>
    <script src="juyou-sync.js"></script>
    <script src="data/juyou-courses-registry.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #333; min-height: 100vh; }
        :root { --brand: #4f6ef7; --text-main: #1a1a2e; --text-sub: #666; --text-mute: #999; --border: #eef1f8; }
        a { text-decoration: none; color: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d8dfee; border-radius: 99px; }

        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar .logo { font-size: 20px; font-weight: 800; color: var(--brand); padding: 0 12px; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; }
        .nav-group { margin-bottom: 8px; }
        .nav-group-title { font-size: 11px; color: #bbb; padding: 8px 12px; letter-spacing: 1px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; font-size: 14px; color: var(--text-sub); cursor: pointer; transition: background 0.2s, color 0.2s; margin-bottom: 2px; }
        .nav-item:hover { background: #f4f6fc; color: var(--brand); }
        .nav-item.on { background: #eef2ff; color: var(--brand); font-weight: 600; }
        .nav-item .nav-icon { font-size: 17px; width: 20px; text-align: center; flex-shrink: 0; }
        .sidebar-bottom { margin-top: auto; padding-top: 16px; }
        .vip-card { background: linear-gradient(135deg, #4f6ef7, #7b8fff); border-radius: 14px; padding: 16px; color: #fff; margin-bottom: 10px; cursor: pointer; }
        .vip-card .vip-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .vip-card .vip-desc { font-size: 11px; opacity: 0.85; line-height: 1.5; }

        .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 50; }
        .search-box { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: #f4f6fc; border-radius: 10px; padding: 0 14px; height: 40px; }
        .search-box input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--text-main); }
        .search-box input::placeholder { color: #b3bdd1; }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .streak-pill { display: flex; align-items: center; gap: 5px; background: #fff5f0; border: 1px solid #ffe3d3; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #ff6b35; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #4f6ef7, #7b8fff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        .content-scroll { padding: 24px 28px 40px; }
        .content-wrap { max-width: 1200px; margin: 0 auto; }

        .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
        .page-head .page-title { font-size: 24px; font-weight: 800; color: var(--text-main); }
        .page-head .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 26px; padding: 0 12px; border-radius: 20px; background: linear-gradient(135deg, #4f6ef7, #6b8aff); color: #fff; font-size: 13px; font-weight: 800; }
        .page-head .btn-add { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 10px; border: none; background: linear-gradient(135deg, #4f6ef7, #6b8aff); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 110, 247, 0.3); font-family: inherit; white-space: nowrap; }

        .sort-tabs { display: flex; gap: 0; background: #fff; border-radius: 12px; padding: 5px; margin-bottom: 20px; width: fit-content; box-shadow: 0 2px 8px rgba(20, 40, 90, 0.04); }
        .sort-tab { padding: 9px 22px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; white-space: nowrap; user-select: none; }
        .sort-tab:hover { color: var(--brand); }
        .sort-tab.on { background: linear-gradient(135deg, #4f6ef7, #6b8aff); color: #fff; box-shadow: 0 3px 10px rgba(79, 110, 247, 0.28); }

        /* ★ 方形课程网格 */
        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }

        .course-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(20, 40, 90, 0.04);
            display: flex;
            flex-direction: column;
            border: 1.5px solid transparent;
        }
        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(79, 110, 247, 0.15);
            border-color: #c9d4f5;
        }

        .course-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            position: relative;
            overflow: hidden;
        }

        .grad-1 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .grad-2 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .grad-3 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .grad-4 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .grad-5 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .grad-6 { background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%); }
        .grad-7 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .grad-8 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }

        .course-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .course-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .course-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
        }

        .course-level {
            font-size: 11px;
            font-weight: 600;
            color: #16a34a;
            background: #ecfdf5;
            padding: 3px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .course-level.mid { color: #d97706; background: #fef3c7; }
        .course-level.high { color: #dc2626; background: #fee2e2; }

        .course-percent {
            font-size: 14px;
            font-weight: 800;
            color: var(--brand);
            white-space: nowrap;
        }

        .course-progress-track {
            width: 100%;
            height: 6px;
            background: #eef1f8;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .course-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f6ef7, #7b8fff);
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .course-progress-text {
            font-size: 12px;
            color: var(--text-mute);
        }

        /* 空状态 */
        .empty-state { text-align: center; padding: 70px 20px 80px; grid-column: 1 / -1; }
        .empty-state .es-icon { font-size: 82px; margin-bottom: 18px; opacity: 0.18; }
        .empty-state .es-text { font-size: 15px; color: var(--text-mute); margin-bottom: 26px; }
        .empty-state .es-btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 32px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4f6ef7, #6b8aff); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(79, 110, 247, 0.32); font-family: inherit; }

        @media (max-width: 768px) {
            .sidebar { width: 64px; padding: 16px 8px; }
            .sidebar .logo { font-size: 0; justify-content: center; padding: 0; }
            .sidebar .logo .logo-icon { font-size: 22px; }
            .nav-item { justify-content: center; padding: 12px 0; }
            .nav-item .nav-text { display: none; }
            .nav-group-title { display: none; }
            .vip-card { display: none; }
            .content-scroll { padding: 16px 14px 32px; }
            .topbar { padding: 12px 14px; }
            .page-head .page-title { font-size: 20px; }
            .course-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .course-cover { font-size: 48px; }
            .course-title { font-size: 14px; min-height: 38px; }
        }
    </style>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="logo"><span class="logo-icon">🎯</span><span class="logo-text">句游英语</span></div>
        <nav>
            <div class="nav-group">
                <div class="nav-group-title">学习</div>
                <div class="nav-item" data-href="home.html"><span class="nav-icon">🏠</span><span class="nav-text">首页</span></div>
                <div class="nav-item on" data-href="my-courses.html"><span class="nav-icon">📁</span><span class="nav-text">我的课程</span></div>
                <div class="nav-item" data-href="mall.html"><span class="nav-icon">📚</span><span class="nav-text">课程包商城</span></div>
                <div class="nav-item" data-href="archive.html"><span class="nav-icon">🗂️</span><span class="nav-text">学习档案</span></div>
                <div class="nav-item" data-href="growth.html"><span class="nav-icon">📈</span><span class="nav-text">成长分析</span></div>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">社交</div>
                <div class="nav-item" data-href="community.html"><span class="nav-icon">👥</span><span class="nav-text">社区</span></div>
                <div class="nav-item" data-href="community.html"><span class="nav-icon">⚔️</span><span class="nav-text">PK 对战</span></div>
                <div class="nav-item" data-href="community.html"><span class="nav-icon">🏆</span><span class="nav-text">排行榜</span></div>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">我的</div>
                <div class="nav-item" data-href="profile.html"><span class="nav-icon">👤</span><span class="nav-text">个人中心</span></div>
                <div class="nav-item" data-href="promote.html"><span class="nav-icon">💰</span><span class="nav-text">推广返佣</span></div>
                <div class="nav-item" data-href="plugin.html"><span class="nav-icon">🧩</span><span class="nav-text">浏览器插件</span></div>
            </div>
        </nav>
        <div class="sidebar-bottom">
            <div class="vip-card" data-href="profile.html">
                <div class="vip-title">👑 升级会员</div>
                <div class="vip-desc">解锁全部课程<br>AI 助手无限次提问</div>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="搜索课程...">
            </div>
            <div class="topbar-right">
                <div class="streak-pill"><span>🔥</span><span id="streakText">0 天</span></div>
                <div class="user-avatar" id="userAvatar" data-href="profile.html">学</div>
            </div>
        </header>

        <div class="content-scroll">
            <div class="content-wrap">
                <div class="page-head">
                    <span class="page-title">我的课程</span>
                    <span class="count-badge" id="courseCount">0</span>
                    <button class="btn-add" id="btnAdd">+ 添加</button>
                </div>

                <div class="sort-tabs" id="sortTabs">
                    <div class="sort-tab on" data-sort="addTime">按加入时间</div>
                    <div class="sort-tab" data-sort="recent">按最近练习</div>
                    <div class="sort-tab" data-sort="progress">按练习进度</div>
                </div>

                <div id="courseArea"></div>
            </div>
        </div>
    </div>
</div>

<script>
/* 登录检查 */
(function() {
    var userStr = localStorage.getItem('juyou_user');
    if (!userStr) { window.location.href = 'index.html'; return; }
    var user = null;
    try { user = JSON.parse(userStr); } catch (e) { localStorage.removeItem('juyou_user'); window.location.href = 'index.html'; return; }
    if (!user || !user.phone) { localStorage.removeItem('juyou_user'); window.location.href = 'index.html'; return; }
    window.currentUser = user;
    var avatarEl = document.getElementById('userAvatar');
    if (avatarEl) avatarEl.textContent = (user.nickname || '学习者').slice(-1);
})();

/* 我的课程读写 */
function getMyCourses() {
    try {
        var raw = localStorage.getItem('juyou_my_courses');
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}

var state = { sort: 'addTime', keyword: '' };

function renderEmpty() {
    return '<div class="empty-state">' +
        '<div class="es-icon">📖</div>' +
        '<div class="es-text">暂无课程，去挑选感兴趣的课程吧</div>' +
        '<button class="es-btn" id="btnBrowse"><span>🧭</span><span>浏览课程市场</span></button>' +
    '</div>';
}

function renderGrid(items) {
    if (items.length === 0) return renderEmpty();
    var html = '<div class="course-grid">';
    items.forEach(function(item) {
        var course = window.JY_COURSES ? window.JY_COURSES.get(item.courseId) : null;
        if (!course) return;

        var totalLessons = (course.units || []).length;
        var completedCount = (item.completedLessons || []).length;
        var percent = item.progress || 0;

        var levelCls = 'course-level';
        if (course.level === '中级') levelCls += ' mid';
        else if (course.level === '高级') levelCls += ' high';

        html +=
            '<div class="course-card" data-course="' + course.courseId + '">' +
                '<div class="course-cover grad-' + (course.grad || 1) + '">' + (course.emoji || '📘') + '</div>' +
                '<div class="course-body">' +
                    '<div class="course-title">' + course.title + '</div>' +
                    '<div class="course-row">' +
                        '<span class="' + levelCls + '">' + (course.level || '初级') + '</span>' +
                        '<span class="course-percent">' + percent + '%</span>' +
                    '</div>' +
                    '<div class="course-progress-track">' +
                        '<div class="course-progress-fill" style="width:' + percent + '%"></div>' +
                    '</div>' +
                    '<div class="course-progress-text">已完成 ' + completedCount + ' / ' + totalLessons + ' 节</div>' +
                '</div>' +
            '</div>';
    });
    html += '</div>';
    return html;
}

function render() {
    var area = document.getElementById('courseArea');
    var countEl = document.getElementById('courseCount');
    if (!area) return;

    var list = getMyCourses();

    if (state.keyword) {
        var kw = state.keyword.toLowerCase();
        list = list.filter(function(item) {
            var c = window.JY_COURSES ? window.JY_COURSES.get(item.courseId) : null;
            return c && c.title.toLowerCase().indexOf(kw) >= 0;
        });
    }

    // ★ 排序：加入时间默认最新在前
    if (state.sort === 'addTime') list.sort(function(a, b) { return (b.addTime || 0) - (a.addTime || 0); });
    else if (state.sort === 'recent') list.sort(function(a, b) { return (b.lastPracticeTime || 0) - (a.lastPracticeTime || 0); });
    else if (state.sort === 'progress') list.sort(function(a, b) { return (b.progress || 0) - (a.progress || 0); });

    countEl.textContent = getMyCourses().length;

    area.innerHTML = renderGrid(list);

    var b = document.getElementById('btnBrowse');
    if (b) b.addEventListener('click', function() { window.location.href = 'mall.html'; });
}

(function() {
    var sortTabs = document.getElementById('sortTabs');
    var searchInput = document.getElementById('searchInput');
    var btnAdd = document.getElementById('btnAdd');

    if (btnAdd) btnAdd.addEventListener('click', function() { window.location.href = 'mall.html'; });

    if (sortTabs) {
        sortTabs.addEventListener('click', function(e) {
            var tab = e.target.closest('.sort-tab');
            if (!tab) return;
            sortTabs.querySelectorAll('.sort-tab').forEach(function(t) { t.classList.remove('on'); });
            tab.classList.add('on');
            state.sort = tab.getAttribute('data-sort');
            render();
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', function() {
            state.keyword = this.value.trim();
            render();
        });
    }

    var area = document.getElementById('courseArea');
    if (area) {
        area.addEventListener('click', function(e) {
            var card = e.target.closest('.course-card');
            if (!card) return;
            var courseId = card.getAttribute('data-course');
            if (!courseId) return;
            window.location.href = 'course.html?course=' + encodeURIComponent(courseId);
        });
    }

    document.querySelectorAll('[data-href]').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            var href = this.getAttribute('data-href');
            if (!href) return;
            window.location.href = href;
        });
    });

    render();
})();
</script>

</body>
</html>
